<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A8744A">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel">
<title>Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  color-scheme: light;
  --bg:#F7F0EA; --surface:#FFFFFF; --surface2:#EFE4DB; --ink:#1F1A1B; --muted:#7A6A62; --line:#E2D5CB;
  --accent:#A8744A; --accent-ink:#FFFFFF; --warn:#9A5B2E; --warn-bg:#F6E3D3; --ok:#3F6B4A; --ok-bg:#E3EEE3; --danger:#A33A2E;
  --shadow:0 -8px 30px rgba(31,26,27,.18);
  --f-display:"Playfair Display", Georgia, serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
#hd h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.01em}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#main{overflow-y:auto;overflow-x:hidden;padding-bottom:20px;-webkit-overflow-scrolling:touch;min-width:0}
#tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:0 -12px;padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;color:var(--muted);font-size:10px;font-weight:600;border-radius:12px;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
@media (max-width:380px){.tab{font-size:9px}}

.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--ink);min-height:42px;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn.dng{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:12px}
.search:focus{border-color:var(--accent);outline:0}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.row.plain{cursor:default}
.cimg{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--surface2)}
.cimg.ph{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:18px}
.cimg.big{width:96px;height:96px;display:block;margin:4px 0 6px}
.th{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.mid{min-width:0;display:grid;gap:2px}
.mid b{font-weight:600;overflow-wrap:anywhere}
.mid small{color:var(--muted)}
.chip{display:inline-block;background:var(--surface2);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.pchip{border:0;min-height:34px;padding:4px 12px;border-radius:999px;font-weight:600;font-size:13px}
.pchip.ok{background:var(--ok-bg);color:var(--ok)}
.pchip.warn{background:var(--warn-bg);color:var(--warn)}
.pchip.bad{background:#F3D9D5;color:var(--danger)}
.pchip.mut{background:var(--surface2);color:var(--muted)}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;min-width:0}
.sum div.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sum small{display:block;opacity:.85;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sum strong{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.kpis small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpis strong{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;font-family:var(--f-display);font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:34ch}

.card2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.card2 h3{margin:0;font-family:var(--f-display);font-size:18px}
.card2 p{margin:0;color:var(--muted)}
.day{margin:14px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-top:6px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px;margin-top:6px}
.bars div{display:grid;gap:3px;justify-items:center;align-content:end;height:100%}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars small{font-size:10px;color:var(--muted)}
.bars div.cur small{color:var(--ink);font-weight:700}

.ov{position:fixed;inset:0;background:rgba(31,26,27,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-family:var(--f-display);font-size:22px;min-width:0;overflow-wrap:anywhere}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:18px;line-height:1;flex-shrink:0}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.fld input,.fld select,.fld textarea,.inp{width:100%;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;min-width:0;-webkit-appearance:none;appearance:none}
.fld input[type=date]{min-height:44px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.two>*{min-width:0}
.totbar{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:20px;font-weight:700}
.ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;background:var(--accent);color:var(--accent-ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="main"></main>
  <nav id="tabs">
    <button class="tab" data-act="tab" data-tab="cli"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/></svg>Clientes</button>
    <button class="tab" data-act="tab" data-tab="ag"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="tab" data-act="tab" data-tab="svc"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>Serviços</button>
    <button class="tab" data-act="tab" data-tab="cur"><svg viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>Cursos</button>
    <button class="tab" data-act="tab" data-tab="rel"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Relatórios</button>
    <button class="tab" data-act="tab" data-tab="avi"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Avisos</button>
    <button class="tab" data-act="tab" data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
  </nav>
</div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
var KEY='painel-marca-v4';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var brl=function(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)};
var r2=function(n){return Math.round(n*100)/100};
var fmtNum=function(n){return (Number(n)||0).toFixed(2).replace('.',',')};
var parseNum=function(v){v=String(v==null?'':v).trim().replace(/[^\d,.\-]/g,'');if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:0};
var ymd=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var ym=function(d){return ymd(d).slice(0,7)};
var fmtD=function(s){return s.slice(8,10)+'/'+s.slice(5,7)};
var addMonths=function(d,k){var x=new Date(d.getFullYear(),d.getMonth()+k,1),l=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),l));return x};
var addDays=function(d,k){var x=new Date(d);x.setDate(x.getDate()+k);return x};
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MCUR=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var DEFTPL='Oi, {nome}! Tudo bem? 💛\n\nPassando só para lembrar, com carinho, da sua parcela {parcela} de {valor}, que {quando}.\n\nSe já fez o pagamento, me avisa que eu dou baixa por aqui. Obrigada pela confiança! 🌷\n\n{loja}';

/* ---------- Estado ----------
   services: [{id,name,price}]
   client: {id,name,phone,buys:[{id,t,type,name,price,paid}],parc:[{id,bid,i,n,due,val,paid}]}
   Venda à vista: paid:true, sem parcelas.
   Pagar depois: uma parcela (n=1) com a data "pagar até".
   Boleto/parcelado: várias parcelas. */
var S={shop:'',msgTpl:'',services:[],courses:[],sellers:[],appts:[],confTpl:'',goal:0,goalDays:[1,2,3,4,5,6],clients:[]};
var T={tab:'cli',wk:'',q:'',cf:'cli',cph:'',cid:null,ym:ym(new Date())};
function load(){try{var v=localStorage.getItem(KEY);if(v){var o=JSON.parse(v);S={shop:o.shop||'',msgTpl:o.msgTpl||'',services:o.services||[],courses:o.courses||[],sellers:o.sellers||[],appts:o.appts||[],confTpl:o.confTpl||'',goal:+o.goal||0,goalDays:Array.isArray(o.goalDays)?o.goalDays:[1,2,3,4,5,6],clients:o.clients||[]};migrate()}}catch(e){}}
function migrate(){
  var add=[],ch=false;
  S.clients.forEach(function(c){
    c.buys=c.buys||[];c.parc=c.parc||[];
    if(c.kind)return;
    ch=true;
    var cb=c.buys.filter(function(b){return b.type==='curso'}),ns=c.buys.length-cb.length;
    if(cb.length&&!ns){c.kind='cur';return}
    c.kind='cli';
    if(cb.length){
      var ids={};cb.forEach(function(b){ids[b.id]=1});
      add.push({id:uid(),name:c.name,phone:c.phone||'',kind:'cur',buys:cb,parc:c.parc.filter(function(x){return ids[x.bid]})});
      c.buys=c.buys.filter(function(b){return b.type!=='curso'});
      c.parc=c.parc.filter(function(x){return !ids[x.bid]});
    }
  });
  add.forEach(function(x){S.clients.push(x)});
  if(ch)save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste navegador')}}
var client=function(id){return S.clients.find(function(c){return c.id===id})};
var service=function(id){return (S.services||[]).find(function(s){return s.id===id})};
var course=function(id){return (S.courses||[]).find(function(c){return c.id===id})};
var courseSorted=function(){return (S.courses||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR')})};
var svcSorted=function(){return (S.services||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR')})};

/* ---------- Helpers ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2400)}
function sheet(title,body){closeSheet();var o=document.createElement('div');o.className='ov';o.id='ov';o.dataset.act='ovClose';
  o.innerHTML='<div class="sheet" role="dialog" aria-label="'+esc(title)+'"><div class="sh"><h2>'+esc(title)+'</h2><button class="x" data-act="closeSheet" aria-label="Fechar">✕</button></div>'+body+'</div>';
  document.body.appendChild(o);return o}
function closeSheet(){var o=$('#ov');if(o)o.remove()}
function entryOf(b){return b.entry!=null?b.entry:(b.paid?b.price:0)}
function entryDay(ds){var v=0,n=0;S.clients.forEach(function(c){c.buys.forEach(function(b){if(ymd(new Date(b.t))===ds){v+=entryOf(b);n++}})});return {v:r2(v),n:n}}
function owedOf(c){var s=0;(c.parc||[]).forEach(function(p){if(!p.paid)s+=p.val});return r2(s)}
function bdate(b){return ym(new Date(b.t))}
function parcOf(c,b){return (c.parc||[]).filter(function(p){return p.bid===b.id})}
function split(c,b){
  var ps=parcOf(c,b);
  if(!ps.length)return b.paid?{rec:b.price,open:0}:{rec:r2(b.entry||0),open:r2(b.price-(b.entry||0))};
  var rec=b.entry||0,open=0;ps.forEach(function(p){if(p.paid)rec+=p.val;else open+=p.val});
  return {rec:r2(rec),open:r2(open)};
}
function shiftMonth(key,d){var y=+key.slice(0,4),m=+key.slice(5,7)-1+d;return ym(new Date(y,m,1))}
function lastBuyT(c){var t=0;(c.buys||[]).forEach(function(b){if(b.t>t)t=b.t});return t}
function daysAgo(t){var a=new Date();a.setHours(0,0,0,0);var b=new Date(t);b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function agoText(t){if(!t)return 'Sem procedimentos ainda';var d=daysAgo(t);return d===0?'Hoje':d===1?'Último há 1 dia':'Último há '+d+' dias'}

/* ---------- Clientes ---------- */
function vCli(){
  if(T.cid&&client(T.cid)){vCliDetail();return}
  T.cid=null;
  $('#hd').innerHTML='<h1>Clientes</h1><div class="acts"><button class="btn pri sm" data-act="newCli">+ Cliente</button></div>';
  var cf=T.cf||'cli';
  $('#main').innerHTML='<div class="seg"><button data-act="cliTab" data-f="cli"'+(cf==='cli'?' class="on"':'')+'>Clientes</button><button data-act="cliTab" data-f="cur"'+(cf==='cur'?' class="on"':'')+'>Clientes cursos</button></div><input class="search" data-on="qCli" type="search" placeholder="Buscar cliente" value="'+esc(T.q)+'" autocomplete="off"><div id="list"></div>';
  listCli();
}
function openOf(c,cur){var o=0;c.buys.forEach(function(b){if((b.type==='curso')===cur)o+=split(c,b).open});return r2(o)}
function listCli(){
  var q=T.q.trim().toLowerCase(),cf=T.cf||'cli',isC=cf==='cur';
  var arr=S.clients.filter(function(c){
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    return isC?c.kind==='cur':c.kind!=='cur';
  }).sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR')});
  var el=$('#list');if(!el)return;
  if(!arr.length){el.innerHTML=isC?'<div class="empty"><h3>Nenhum cliente de curso ainda</h3><p>Cadastre um cliente de curso ou registre a venda de um curso.</p><button class="btn pri" data-act="newCli">+ Cliente</button></div>':'<div class="empty"><h3>Nenhum cliente ainda</h3><p>Cadastre um cliente ou registre uma venda, que ele entra aqui sozinho.</p><button class="btn pri" data-act="newCli">+ Cliente</button></div>';return}
  el.innerHTML='<div class="list">'+arr.map(function(c){
    var o=openOf(c,isC),sub;
    if(isC){var seen={};c.buys.forEach(function(b){if(b.type==='curso')seen[b.name.trim()]=1});sub=Object.keys(seen).join(', ')||'Sem curso ainda'}
    else sub=agoText(lastBuyT(c));
    return '<div class="row" data-act="openCli" data-id="'+c.id+'"><div class="th">'+esc(c.name[0].toUpperCase())+'</div><div class="mid"><b>'+esc(c.name)+'</b><small>'+esc(sub)+'</small></div>'+(o>0?'<span class="chip warn">Deve '+brl(o)+'</span>':'<span class="chip ok">Em dia</span>')+'</div>'}).join('')+'</div>';
}
function vCliDetail(){
  var c=client(T.cid),o=owedOf(c),hj=ymd(new Date()),lt=lastBuyT(c);
  $('#hd').innerHTML='<div class="acts"><button class="btn sm" data-act="backCli">‹ Clientes</button></div><div class="acts"><button class="btn sm" data-act="editCli">Editar</button></div>';
  var total=c.buys.reduce(function(s,b){return s+b.price},0);
  var h='<div class="card2"><h3>'+esc(c.name)+'</h3><p>'+(c.phone?esc(c.phone):'Sem telefone')+' · '+agoText(lt)+(lt?' ('+fmtD(ymd(new Date(lt)))+')':'')+'</p>'

function saleSave(type){
  var cid=$('#sv-cli').value,name=$('#sv-name').value.trim(),val=parseNum($('#sv-val').value),dstr=$('#sv-date').value,pay=$('#sv-pay').value;
  if(!name){toast(type==='curso'?'Digite o nome do curso':'Escolha ou digite o serviço');return}
  if(!(val>0)){toast('Digite o valor');return}
  if(!dstr){toast('Escolha a data da venda');return}
  var sel=(S.sellers||[]).find(function(x){return x.id===$('#sv-by').value});
  if(!sel){toast((S.sellers||[]).length?'Escolha quem vendeu':'Cadastre quem vende em Ajustes');return}
  var entry=pay==='paid'?val:Math.max(0,r2(parseNum(($('#sv-entry')||{}).value)));
  if(pay!=='paid'&&entry>=val){toast('A entrada precisa ser menor que o valor. Para pagar tudo, escolha “Pago agora”.');return}
  var c;
  if(cid==='__new'){var n=$('#sv-new').value.trim();if(!n){toast('Digite o nome do cliente');return}c={id:uid(),name:n,phone:'',kind:type==='curso'?'cur':'cli',buys:[],parc:[]};S.clients.push(c)}
  else c=client(cid);
  if(!c){toast('Escolha o cliente');return}
  var bid=uid(),t=new Date(dstr+'T12:00:00').getTime(),cents=Math.round((val-entry)*100);
  c.buys.push({id:bid,t:t,type:type,name:name,price:r2(val),paid:pay==='paid',entry:r2(entry),sid:sel.id,by:sel.name});
  c.parc=c.parc||[];
  if(pay==='later'){
    var due=$('#sv-until').value;if(!due){toast('Escolha a data “pagar até”');return}
    c.parc.push({id:uid(),bid:bid,i:1,n:1,due:due,val:r2(val-entry),paid:false});
  }else if(pay==='parc'){
    var n2=+$('#sv-n').value,base=Math.floor(cents/n2),rem=cents-base*n2,d0=new Date($('#sv-due').value+'T12:00:00');
    if(isNaN(d0)){toast('Escolha o vencimento da 1ª parcela');return}
    for(var i=0;i<n2;i++)c.parc.push({id:uid(),bid:bid,i:i+1,n:n2,due:ymd(addMonths(d0,i)),val:(base+(i<rem?1:0))/100,paid:false});
  }
  save();closeSheet();T.cid=c.id;T.tab='cli';render();toast(type==='curso'?'Curso registrado':'Venda registrada');
}

/* ---------- Relatórios ---------- */
function vRel(){
  $('#hd').innerHTML='<h1>Relatórios</h1>';
  var key=T.ym,y=key.slice(0,4),mIdx=+key.slice(5,7)-1;
  var mon={fat:0,rec:0,open:0,n:0,tipo:{},itens:{},sel:{}};

  var geralOpen=0,openCli=0,openCur=0;

        var nm=tk+'|'+b.name.trim().toLowerCase(),it=mon.itens[nm]||(mon.itens[nm]={name:b.name.trim(),n:0,v:0,type:tk});it.n++;it.v+=b.price;

        var si=sp.itens[nm]||(sp.itens[nm]={name:b.name.trim(),n:0,v:0,type:tk});si.n++;si.v+=b.price;
      }

  h+='<div class="card2"><h3>Recebimento do mês</h3><p>'+pct+'% do que foi vendido neste mês já entrou.</p></div>';
  (function(){
    var td=ymd(new Date()),tm=td.slice(0,7),gl=S.goal||0;
    var c='<div class="card2"><h3>Meta diária de fechamento</h3><p>Conta só o que entrou na hora do fechamento (entrada ou pagamento à vista), não o total da venda.</p>'
      +'<label class="fld"><span>Meta por dia (R$)</span><input id="goal-in" type="text" inputmode="decimal" value="'+(gl?fmtNum(gl):'')+'" placeholder="0,00"></label>'
      +'<button class="btn pri" data-act="setGoal">Salvar meta</button>'

  function card(title,tp,arr,empty){

    +'<div class="card2"><h3>Instalar como app</h3><p><b style="color:var(--ink)">iPhone:</b> abra no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p><p><b style="color:var(--ink)">Android:</b> abra no Chrome e escolha “Instalar app” ou “Adicionar à tela inicial”.</p></div>'
    +'<div class="card2"><h3>Zona de cuidado</h3><p>Apaga todos os clientes e vendas deste aparelho. Os serviços fixos são mantidos.</p><button class="btn dng" data-act="wipe">Apagar clientes e vendas</button></div>';
  tplPv();
}
function tplPv(){var e=$('#tpl-pv');if(!e)return;var c={name:'Maria Silva',parc:[]},hj=new Date(),p={val:25,i:1,n:2,due:ymd(addDays(hj,2))};e.textContent=fillTpl(S.msgTpl&&S.msgTpl.trim()?S.msgTpl:DEFTPL,tplVars(c,p))}

/* ---------- Ações ---------- */
var A={
  tab:function(el){T.tab=el.dataset.tab;T.q='';T.cid=null;render()},
  ovClose:function(el,e){if(e.target===el)closeSheet()},
  closeSheet:closeSheet,
  newCli:function(){cliForm()},
  openCli:function(el){T.cf=((client(el.dataset.id)||{}).kind==='cur')?'cur':'cli';T.cid=el.dataset.id;T.tab='cli';render()},
  backCli:function(){T.cid=null;render()},
  editCli:function(){cliForm(T.cid)},
  saveCli:function(el){
    var n=$('#cf-name').value.trim();if(!n){toast('Digite o nome');return}
    var ph=$('#cf-phone').value.trim();
    if(el.dataset.id){var c=client(el.dataset.id);c.name=n;c.phone=ph}
    else S.clients.push({id:uid(),name:n,phone:ph,kind:T.cf==='cur'?'cur':'cli',buys:[],parc:[]});
    save();closeSheet();render();toast('Cliente salvo');
  },
  delCli:function(el){if(!confirm('Remover este cliente e todo o histórico dele?'))return;S.clients=S.clients.filter(function(c){return c.id!==el.dataset.id});S.appts=(S.appts||[]).filter(function(a){return a.cid!==el.dataset.id});T.cid=null;save();closeSheet();render();toast('Cliente removido')},
  newSvc:function(){svcForm()},
  editSvc:function(el){svcForm(el.dataset.id)},
  saveSvc:function(el){
    var n=$('#sf-name').value.trim(),p=parseNum($('#sf-price').value);
    if(!n){toast('Digite o nome do serviço');return}
    if(!(p>0)){toast('Digite o preço fixo');return}
    if(el.dataset.id){var s=service(el.dataset.id);s.name=n;s.price=r2(p)}
    else S.services.push({id:uid(),name:n,price:r2(p)});
    save();closeSheet();render();toast('Serviço salvo');
  },
  delSvc:function(el){if(!confirm('Remover este serviço da lista? As vendas antigas continuam salvas.'))return;S.services=S.services.filter(function(s){return s.id!==el.dataset.id});save();closeSheet();render();toast('Serviço removido')},
  cliTab:function(el){T.cf=el.dataset.f||'cli';render()},
  agPrev:function(){T.wk=ymd(addDays(wkStart(),-7));render()},
  agNext:function(){T.wk=ymd(addDays(wkStart(),7));render()},
  newAppt:function(){apptForm()},
  apEdit:function(el){apptForm(el.dataset.id)},
  apSave:function(el){
    var cid=$('#ap-cli').value,dt=$('#ap-date').value,tm=$('#ap-time').value,wh=$('#ap-what').value.trim();
    if(!dt){toast('Escolha o dia');return}
    if(!tm){toast('Escolha a hora');return}
    if(cid==='__new'){var n=$('#ap-new').value.trim();if(!n){toast('Digite o nome do cliente');return}var c={id:uid(),name:n,phone:'',kind:'cli',buys:[],parc:[]};S.clients.push(c);cid=c.id}
    if(!client(cid)){toast('Escolha o cliente');return}
    S.appts=S.appts||[];
    if(el.dataset.id){var a=S.appts.find(function(x){return x.id===el.dataset.id});a.cid=cid;a.date=dt;a.time=tm;a.what=wh}
    else S.appts.push({id:uid(),cid:cid,date:dt,time:tm,what:wh,ok:false,sent:false});
    T.wk=ymd(mondayOf(new Date(dt+'T12:00:00')));
    save();closeSheet();render();toast('Horário salvo');
  },
  apDel:function(el){if(!confirm('Remover este horário?'))return;S.appts=S.appts.filter(function(x){return x.id!==el.dataset.id});save();closeSheet();render();toast('Horário removido')},
  apToggle:function(el){var a=S.appts.find(function(x){return x.id===el.dataset.id});if(a){a.ok=!a.ok;save();render()}},
  setGoal:function(){S.goal=Math.max(0,r2(parseNum($('#goal-in').value)));save();render();toast(S.goal>0?'Meta salva':'Meta desligada')},
  goalDay:function(el){var d=+el.dataset.d,i=S.goalDays.indexOf(d);if(i>-1)S.goalDays.splice(i,1);else S.goalDays.push(d);save();render()},
  apResSheet:function(el){resSheet(el.dataset.id)},
  apRes:function(el){var a=S.appts.find(function(x){return x.id===el.dataset.id});if(!a)return;if(el.dataset.r)a.res=el.dataset.r;else delete a.res;save();closeSheet();render()},
  apAsk:function(el){confSheet(el.dataset.id)},
  confGo:function(el){
    var a=S.appts.find(function(x){return x.id===el.dataset.id}),c=a&&client(a.cid);if(!c)return;
    var ph=$('#cg-phone').value.trim(),d=ph.replace(/\D/g,''),txt=$('#cg-text').value;
    if(!d){toast('Digite o WhatsApp do cliente');return}
    if(d.length<=11)d='55'+d;
    c.phone=ph;a.sent=true;save();
    window.open('https://wa.me/'+d+'?text='+encodeURIComponent(txt),'_blank');
    closeSheet();render();
  },
  wkMsg:function(){window.open('https://wa.me/?text='+encodeURIComponent(weekMsg()),'_blank')},
  wkCopy:function(){
    var m=weekMsg();
    try{navigator.clipboard.writeText(m).then(function(){toast('Mensagem copiada')},function(){toast('Não consegui copiar')})}catch(e){toast('Não consegui copiar')}
  },
  cfReset:function(){S.confTpl='';save();render();toast('Mensagem padrão restaurada')},
  addSeller:function(){
    var n=$('#se-name').value.trim();if(!n){toast('Digite o nome');return}
    if(S.sellers.some(function(p){return p.name.toLowerCase()===n.toLowerCase()})){toast('Esse nome já está na lista');return}
    S.sellers.push({id:uid(),name:n});save();render();toast('Pessoa adicionada');
  },
  delSeller:function(el){if(!confirm('Remover esta pessoa? As vendas antigas continuam com o nome dela.'))return;S.sellers=S.sellers.filter(function(p){return p.id!==el.dataset.id});save();render();toast('Pessoa removida')},
  newCourse:function(){courseForm()},
  editCourse:function(el){courseForm(el.dataset.id)},
  saveCourse:function(el){
    var n=$('#cc-name').value.trim(),pr=parseNum($('#cc-price').value);
    if(!n){toast('Digite o nome do curso');return}
    if(!(pr>0)){toast('Digite o preço');return}
    if(el.dataset.id){var c=course(el.dataset.id);c.name=n;c.price=r2(pr);c.photo=T.cph||''}
    else S.courses.push({id:uid(),name:n,price:r2(pr),photo:T.cph||''});
    T.cph='';save();closeSheet();render();toast('Curso salvo');
  },
  delCourse:function(el){if(!confirm('Remover este curso da lista? As vendas antigas continuam salvas.'))return;S.courses=S.courses.filter(function(c){return c.id!==el.dataset.id});save();closeSheet();render();toast('Curso removido')},
  cphDel:function(){T.cph='';cphShow()},
  newSale:function(el){saleForm(el.dataset.type||'servico',el.dataset.cid||'')},
  saleGo:function(el){saleSave(el.dataset.type)},
  delBuy:function(el){if(!confirm('Remover esta venda? As parcelas dela também saem.'))return;var c=client(T.cid),bid=el.dataset.id;c.buys=c.buys.filter(function(b){return b.id!==bid});c.parc=(c.parc||[]).filter(function(p){return p.bid!==bid});save();render();toast('Venda removida')},
  togglePar:function(el){var c=client(T.cid),p=(c.parc||[]).find(function(x){return x.id===el.dataset.id});if(p){p.paid=!p.paid;save();render()}},
  cobrar:function(el){cobrarSheet(el.dataset.id,el.dataset.pid||'')},
  cobGo:function(el){
    var c=client(el.dataset.id),ph=$('#cob-phone').value.trim(),d=ph.replace(/\D/g,'');
    if(!d){toast('Digite o WhatsApp do cliente');return}
    if(d.length<=11)d='55'+d;
    c.phone=ph;save();
    window.open('https://wa.me/'+d+'?text='+encodeURIComponent($('#cob-text').value),'_blank');
  },
  rmPrev:function(){T.ym=shiftMonth(T.ym,-1);render()},
  rmNext:function(){T.ym=shiftMonth(T.ym,1);render()},
  avPrev:function(){T.ym=shiftMonth(T.ym,-1);render()},
  avNext:function(){T.ym=shiftMonth(T.ym,1);render()},
  tplReset:function(){S.msgTpl='';save();render();toast('Mensagem padrão restaurada')},
  bkSave:function(){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='backup-painel-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},1500);
  },
  wipe:function(){if(!confirm('Apagar clientes e vendas deste aparelho? Isso não dá para desfazer.'))return;S.clients=[];S.appts=[];save();render();toast('Clientes e vendas apagados')}
};
var H={
  qCli:function(el){T.q=el.value;listCli()},
  svCli:function(el){$('#sv-new-wrap').hidden=el.value!=='__new'},
  svPay:function(el){$('#sv-parc').hidden=el.value!=='parc';$('#sv-later').hidden=el.value!=='later';$('#sv-entry-wrap').hidden=el.value==='paid';svTotal()},
  svSvc:function(el){
    var nameEl=$('#sv-name'),valEl=$('#sv-val');
    if(el.value==='__other'){nameEl.value='';valEl.value='';svTotal();nameEl.focus();return}
    var o=el.selectedOptions[0];if(!o||!el.value)return;
    nameEl.value=o.textContent.split(' · ')[0];valEl.value=fmtNum(+o.dataset.p);svTotal();
  },
  ccPhoto:function(el){var f=el.files&&el.files[0];if(!f)return;readPhoto(f,function(d){T.cph=d;cphShow()})},
  apCli:function(el){$('#ap-new-wrap').hidden=el.value!=='__new'},
  svVal:svTotal,
  tplIn:function(el){S.msgTpl=el.value;save();tplPv()},
  bkFile:function(el){var f=el.files&&el.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!Array.isArray(o.clients))throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;S={shop:o.shop||'',msgTpl:o.msgTpl||'',services:o.services||[],courses:o.courses||[],sellers:o.sellers||[],appts:o.appts||[],confTpl:o.confTpl||'',goal:+o.goal||0,goalDays:Array.isArray(o.goalDays)?o.goalDays:[1,2,3,4,5,6],clients:o.clients};migrate();save();render();toast('Backup restaurado')}catch(e){toast('Arquivo de backup inválido')}};fr.readAsText(f)}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e)});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='sv-val'||el.id==='sv-entry')svTotal();
  if(el.id==='shop'){S.shop=el.value;save();setupInstall()}
  if(el.id==='tpl-t')H.tplIn(el);
  if(el.id==='cft-t'){S.confTpl=el.value;save()}
  if(el.dataset&&el.dataset.on==='qCli')H.qCli(el);
});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.on&&H[el.dataset.on])H[el.dataset.on](el)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===T.tab)});
  var m=$('#main'),st=m.scrollTop;
  if(T.tab==='cli')vCli();else if(T.tab==='ag')vAg();else if(T.tab==='svc')vSvc();else if(T.tab==='cur')vCur();else if(T.tab==='rel')vRel();else if(T.tab==='avi')vAvi();else vSet();
  m.scrollTop=st;
}
load();T.wk=ymd(mondayOf(new Date()));setupInstall();render();
})();
</script>
