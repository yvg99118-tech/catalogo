.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px 8px;display:grid;justify-items:center;gap:6px;min-width:0}
.pal small{font-weight:600;color:var(--ink);font-size:12.5px}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small,.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:720px;margin:0 auto}
#hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}

.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;border-radius:12px}

.gw{max-width:560px;margin:0 auto;display:grid;gap:14px;align-content:start}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.gbrand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.gh{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.gnote{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.plan.feat{border-color:var(--accent)}

.plan .pr{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .pr small{font-family:var(--f-body);font-size:13.5px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start}
.plan li::before{content:"✓";color:var(--accent);font-weight:700}
.plan li.soon{color:var(--muted)}
.plan li.soon::before{content:"•";color:var(--muted)}
.tag{justify-self:start;background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.accbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.dsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.dt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;display:grid;gap:2px;min-width:0;align-content:start}
.dt small{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.dt strong{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dt em{font-style:normal;font-size:12px;color:var(--muted)}
.dt.hot{border-color:var(--accent)}
.dt.late{background:var(--warn-bg);border-color:transparent}
.dt.late small,.dt.late strong,.dt.late em{color:var(--warn)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--ink);min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn.dng{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:12px}
.search:focus{border-color:var(--accent);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);min-width:0}
.card .ph{aspect-ratio:1/1;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--muted);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .cb b{font-weight:600;overflow-wrap:anywhere}
.price{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

.cbtns{display:grid;gap:6px;margin:6px 10px 10px}
.cbtns .btn{margin:0}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center}

.sum div{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;min-width:0}
.sum div:nth-child(2){background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sum small{display:block;color:inherit;opacity:.8;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sum strong{font-family:var(--f-display);font-size:25px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.list{display:grid;gap:8px}

.right{text-align:right;display:grid;gap:2px}
.qty{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}

.day{margin:14px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:6px}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.link{background:none;border:0;color:var(--danger);font-weight:600;padding:4px 0;font-size:13px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}

.addrow{display:flex;gap:8px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 11px;font-weight:500;font-size:14px}
.chipx button{border:0;background:var(--surface);border-radius:50%;width:22px;height:22px;line-height:1;font-size:13px}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step .btn{font-size:22px;padding:0;min-height:48px}
.step output{text-align:center;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.line .tot{display:flex;justify-content:space-between;align-items:center}
.totbar{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.shareimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
textarea.inp{min-height:110px;resize:vertical}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

    <button class="tab" data-act="tab" data-tab="cli"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Clientes</button>

  </nav>

<div id="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var brl=function(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)};
var fmtNum=function(n){return (Number(n)||0).toFixed(2).replace('.',',')};
var parseNum=function(v){v=String(v==null?'':v).trim().replace(/[^\d,.\-]/g,'');if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:0};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};
var fmtDate=function(t){return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})};
var fmtDT=function(t){var d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
var initial=function(s){return esc((String(s||'?').trim()[0]||'?').toUpperCase())};

/* ---------- Estado e armazenamento ---------- */
var PALS=[{id:'verde',n:'Verde',a:'#0F7A68',bg:'#EEF3F1',s2:'#E2EBE8',ink:'#12302A',mu:'#5A716B'},{id:'vermelho',n:'Vermelho',a:'#C42B3F',bg:'#FBF0F1',s2:'#F4E0E2',ink:'#3B1418',mu:'#7B585C'},{id:'laranja',n:'Laranja',a:'#B54E06',bg:'#FDF3E9',s2:'#F6E2CE',ink:'#3A2210',mu:'#7A5E44'},{id:'rosa',n:'Rosa',a:'#C2377A',bg:'#FCF0F5',s2:'#F6DFEA',ink:'#3B1428',mu:'#7D5668'},{id:'roxo',n:'Roxo',a:'#7B3FC2',bg:'#F5F0FB',s2:'#E9DFF5',ink:'#26143B',mu:'#6A587F'},{id:'azul',n:'Azul',a:'#1D6DB5',bg:'#EDF3FA',s2:'#DFEAF6',ink:'#12263B',mu:'#566B80'},{id:'dourado',n:'Dourado',a:'#946000',bg:'#FBF5E6',s2:'#F3E8C9',ink:'#33270B',mu:'#726031'},{id:'grafite',n:'Grafite',a:'#3F4F5E',bg:'#F0F2F4',s2:'#E2E6EA',ink:'#1A2229',mu:'#5A6772'}];
var pal=function(){return PALS.find(function(p){return p.id===S.theme})||PALS[0]};
function applyTheme(){
  var p=pal();document.documentElement.setAttribute('data-pal',p.id);
  try{localStorage.setItem('catalogo-tema',p.id)}catch(e){}
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.a);
}
var S={v:1,shop:'',theme:'verde',lastBackup:0,products:[],stock:[],clients:[],coupons:[{id:'cp10',name:'10%',type:'pct',val:10}],msg:''};
var storageOK=true,saveTimer=null;
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('catalogo-pronta-entrega',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
function normalize(o){
  o=o&&typeof o==='object'?o:{};
  return {v:1,shop:String(o.shop||''),theme:PALS.some(function(p){return p.id===o.theme})?o.theme:'verde',lastBackup:Number(o.lastBackup)||0,msg:typeof o.msg==='string'?o.msg:'',coupons:Array.isArray(o.coupons)?o.coupons.filter(function(c){return c&&c.name}).map(function(c){return {id:c.id||uid(),name:String(c.name),type:c.type==='val'?'val':'pct',val:Number(c.val)||0}}):[{id:uid(),name:'10%',type:'pct',val:10}],
    products:(Array.isArray(o.products)?o.products:[]).map(function(p){return {id:p.id||uid(),name:String(p.name||'Sem nome'),price:Number(p.price)||0,photo:p.photo||'',cat:!!p.cat,colors:Array.isArray(p.colors)?p.colors:[],sizes:Array.isArray(p.sizes)?p.sizes:[]}}),
    stock:(Array.isArray(o.stock)?o.stock:[]).map(function(r){return {id:r.id||uid(),pid:r.pid,color:r.color||'',size:r.size||'',qty:Math.max(0,parseInt(r.qty,10)||0)}}),
    clients:(Array.isArray(o.clients)?o.clients:[]).map(function(c){return {id:c.id||uid(),name:String(c.name||'Sem nome'),phone:String(c.phone||''),comments:Array.isArray(c.comments)?c.comments:[],buys:Array.isArray(c.buys)?c.buys:[],parc:Array.isArray(c.parc)?c.parc:[]}})};
}
function writeNow(){
  var json=JSON.stringify(S);
  idbSet('state',json).then(function(){storageOK=true}).catch(function(){
    try{localStorage.setItem('catalogo-state',json);storageOK=true}catch(e){storageOK=false}
  }).then(function(){var b=$('#bn');if(b)b.hidden=storageOK});
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){saveTimer=null;writeNow()},250);
}
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;writeNow()}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);
function load(){
  return idbGet('state').catch(function(){return null}).then(function(v){
    if(!v){try{v=localStorage.getItem('catalogo-state')}catch(e){v=null}}
    if(v){try{S=normalize(JSON.parse(v))}catch(e){}}
  });
}
var dl=null;
function initDownloads(){
  dl={save:function(o){
    var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.json$/.test(o.filename)?'application/json':'text/plain'});
    var file=null;try{file=new File([blob],o.filename,{type:blob.type})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:o.filename}).catch(function(e){throw {code:(e&&e.name==='AbortError')?'declined':'unavailable'}});
    }
    if(navigator.standalone===true)return Promise.reject({code:'unavailable'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},1500);return Promise.resolve();
  }};
}
function showErr(msg){
  var b=document.getElementById('errbar');
  if(!b){b=document.createElement('div');b.id='errbar';b.className='banner';b.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99';document.body.appendChild(b)}
  b.textContent='Erro: '+msg;
}
window.addEventListener('error',function(ev){showErr(ev.message||'desconhecido')});
window.addEventListener('unhandledrejection',function(ev){showErr(String(ev.reason&&ev.reason.message||ev.reason||'falha'))});

/* ---------- Helpers de dados ---------- */
var prod=function(id){return S.products.find(function(p){return p.id===id})};
var client=function(id){return S.clients.find(function(c){return c.id===id})};
var srow=function(id){return S.stock.find(function(r){return r.id===id})};
var hasVar=function(p){return p&&(p.colors.length>0||p.sizes.length>0)};
var varLabel=function(o){return [o.color,o.size].filter(Boolean).join(' · ')};
function addStock(pid,color,size,qty){
  var r=S.stock.find(function(x){return x.pid===pid&&x.color===color&&x.size===size});
  if(r)r.qty+=qty;else S.stock.push({id:uid(),pid:pid,color:color,size:size,qty:qty});
}
var thumb=function(p,extra){return '<div class="th">'+(p&&p.photo?'<img alt="" src="'+p.photo+'">':initial(p&&p.name))+(extra||'')+'</div>'};
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function twoTap(el,fn){
  if(el.dataset.armed){fn();return}
  el.dataset.armed='1';el.dataset.label=el.textContent;el.textContent='Toque de novo para confirmar';
  setTimeout(function(){if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.textContent=el.dataset.label}},3500);
}

var bnet=function(b){return Math.round((b.qty*b.price-(b.disc||0))*100)/100};
var cpById=function(id){return (S.coupons||[]).find(function(c){return c.id===id})};
var cpLabel=function(c){return c.type==='pct'?c.val+'% de desconto':brl(c.val)+' de desconto'};
function cpPrice(price,cp){if(!cp)return price;var v=cp.type==='pct'?price*(1-cp.val/100):price-cp.val;return Math.max(0,Math.round(v*100)/100)}
function pend(p){return p.paid?0:Math.max(0,Math.round((p.val-(p.pa||0))*100)/100)}
function groupParc(arr){var m={},o=[];arr.slice().sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:a.i-b.i}).forEach(function(p){var k=p.due+(p.paid?'1':'0');if(!m[k]){m[k]={due:p.due,paid:!!p.paid,ps:[],sum:0};o.push(m[k])}m[k].ps.push(p);m[k].sum+=p.paid?p.val:pend(p)});o.forEach(function(g){g.sum=Math.round(g.sum*100)/100});return o}
var grpTitle=function(g){return g.ps.map(function(p){return brl(p.paid?p.val:pend(p))}).join(' + ')};
var grpPartial=function(g){return g.ps.filter(function(p){return !p.paid&&p.pa>0}).map(function(p){return 'já pagou '+brl(p.pa)+' de '+brl(p.val)}).join('; ')};
var grpLbl=function(g){return g.ps.map(function(p){return p.i+'/'+p.n}).join(' + ')};
var grpAll=function(g){return g.ps.length>1?grpTitle(g)+' = '+brl(g.sum):brl(g.sum)};
var DEFMSG='Oi, {nome}! Tudo bem com você? 💛\n\nPassando só pra lembrar, com todo carinho, da sua parcela de {valor}, que {quando}.\n\nSe você já fez o pagamento, me avisa que eu dou baixa por aqui, tá? E se precisar de qualquer coisa, é só me chamar.\n\nUm beijo e obrigada pela confiança! 🌷';
function fillMsg(t,v){return String(t).replace(/\{(\w+)\}/g,function(m,k){return v[k]!=null?v[k]:m})}

/* ---------- Folhas de ação ---------- */
function sheet(title,body){
  closeSheet();
  var o=document.createElement('div');o.className='ov';o.id='ov';o.dataset.act='ovClose';
  o.innerHTML='<div class="sheet" role="dialog" aria-label="'+esc(title)+'"><div class="sh"><h2>'+esc(title)+'</h2><button class="x" data-act="closeSheet" aria-label="Fechar">✕</button></div>'+body+'</div>';
  document.body.appendChild(o);return o;
}
function closeSheet(){var o=$('#ov');if(o)o.remove()}

/* ---------- Navegação ---------- */
var T={year:new Date().getFullYear(),tab:'prod',pf:'all',q:{prod:'',stock:'',cli:''},selMode:false,sel:new Set(),client:null,ctab:'buys'};
var lastView='';
function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===T.tab)});tabDot();
  var key=T.tab+(T.client||''),m=$('#main'),st=key===lastView?m.scrollTop:0;
  if(T.tab==='cli'&&T.client&&client(T.client))vClient();
  else{T.client=null;({prod:vProd,stock:vStock,cli:vCli,set:vSet})[T.tab]()}
  lastView=T.tab+(T.client||'');m.scrollTop=st;accBanner();
}

/* ---------- Produtos ---------- */
function vProd(){
  $('#hd').innerHTML='<h1>Produtos</h1><div class="acts"><button class="btn pri" data-act="newProd">+ Novo produto</button></div>';
  var nc=S.products.filter(function(p){return p.cat}).length;
  $('#main').innerHTML='<div class="seg"><button class="'+(T.pf==='all'?'on':'')+'" data-act="pf" data-v="all">Todos ('+S.products.length+')</button><button class="'+(T.pf==='cat'?'on':'')+'" data-act="pf" data-v="cat">Meu catálogo ('+nc+')</button></div>'
    +'<input class="search" id="q-prod" data-on="qProd" type="search" placeholder="Buscar produto" value="'+esc(T.q.prod)+'" autocomplete="off"><div id="list"></div>';
  listProd();
}
function listProd(){
  var q=norm(T.q.prod);
  var arr=S.products.filter(function(p){return (T.pf==='all'||p.cat)&&(!q||norm(p.name).indexOf(q)>-1)});
  var el=$('#list');if(!el)return;
  if(!arr.length){
    el.innerHTML=S.products.length&&q?'<div class="empty"><h3>Nada encontrado</h3><p>Nenhum produto com esse nome.</p></div>'
      :T.pf==='cat'?'<div class="empty"><h3>Seu catálogo está vazio</h3><p>Em “Todos”, toque em “Adicionar ao catálogo” nos produtos que você vende.</p></div>'
      :'<div class="empty"><h3>Nenhum produto ainda</h3><p>Cadastre o primeiro produto com foto e preço. Potes podem ter cores e tamanhos.</p><button class="btn pri" data-act="newProd">+ Novo produto</button></div>';
    return;
  }
  el.innerHTML='<div class="grid">'+arr.map(function(p){
    var info=[];if(p.colors.length)info.push(p.colors.length+(p.colors.length>1?' cores':' cor'));if(p.sizes.length)info.push(p.sizes.length+(p.sizes.length>1?' tamanhos':' tamanho'));
    return '<article class="card"><div data-act="editProd" data-id="'+p.id+'"><div class="ph">'+(p.photo?'<img alt="" src="'+p.photo+'">':initial(p.name))+'</div>'
      +'<div class="cb"><b>'+esc(p.name)+'</b><span class="price">'+brl(p.price)+'</span><small>'+(info.join(' · ')||'Sem variações')+'</small></div></div>'
      +'<div class="cbtns"><button class="btn '+(p.cat?'on':'')+'" data-act="toggleCat" data-id="'+p.id+'">'+(p.cat?'✓ No catálogo':'Adicionar ao catálogo')+'</button><button class="btn" data-act="sendCli" data-id="'+p.id+'">Enviar ao cliente</button></div></article>';
  }).join('')+'</div>';
}
var PF=null;
function chipsHTML(kind){
  return PF[kind].map(function(v,i){return '<span class="chipx">'+esc(v)+'<button type="button" data-act="chipDel" data-kind="'+kind+'" data-i="'+i+'" aria-label="Remover '+esc(v)+'">✕</button></span>'}).join('')||'<small>Nenhum</small>';
}
function productForm(id){
  var p=id?prod(id):null;
  PF={id:id||null,photo:p?p.photo:'',colors:p?p.colors.slice():[],sizes:p?p.sizes.slice():[]};
  var o=sheet(p?'Editar produto':'Novo produto',
    '<div class="photo"><div class="pv" id="pf-pv">'+(PF.photo?'<img alt="" src="'+PF.photo+'">':'Sem foto')+'</div><label class="btn sm" style="display:inline-flex;align-items:center">Escolher foto<input id="pf-file" data-on="pfPhoto" type="file" accept="image/*" hidden></label></div>'
    +'<label class="fld"><span>Nome</span><input id="pf-name" type="text" placeholder="Ex.: Pote redondo" value="'+esc(p?p.name:'')+'" autocomplete="off"></label>'
    +'<label class="fld"><span>Preço (R$)</span><input id="pf-price" type="text" inputmode="decimal" placeholder="0,00" value="'+(p?fmtNum(p.price):'')+'"></label>'
    +'<div class="fld"><span>Cores (opcional)</span><div class="addrow"><input class="inp" id="pf-cin" data-kind="colors" placeholder="Ex.: Azul" autocomplete="off"><button class="btn" type="button" data-act="chipAdd" data-kind="colors">Adicionar</button></div><div class="chips" id="ch-colors">'+chipsHTML('colors')+'</div></div>'
    +'<div class="fld"><span>Tamanhos (opcional)</span><div class="addrow"><input class="inp" id="pf-sin" data-kind="sizes" placeholder="Ex.: 500 ml, P, 1,5 L" autocomplete="off"><button class="btn" type="button" data-act="chipAdd" data-kind="sizes">Adicionar</button></div><div class="chips" id="ch-sizes">'+chipsHTML('sizes')+'</div></div>'
    +'<label class="chk"><input type="checkbox" id="pf-cat" '+(!p||p.cat?'checked':'')+'> Mostrar no meu catálogo</label>'
    +'<button class="btn pri block" data-act="saveProd">Salvar produto</button>'
    +(p?'<button class="btn block" data-act="sendCli" data-id="'+p.id+'">Enviar ao cliente</button>':'')
    +(p?'<button class="btn dng block" data-act="delProd" data-id="'+p.id+'">Remover produto</button>':''));
  setTimeout(function(){var n=$('#pf-name');if(n&&!p)n.focus()},50);
}
function chipAdd(kind){
  var inp=$(kind==='colors'?'#pf-cin':'#pf-sin');var v=inp.value.trim();if(!v)return;
  if(PF[kind].indexOf(v)<0)PF[kind].push(v);
  inp.value='';$('#ch-'+kind).innerHTML=chipsHTML(kind);inp.focus();
}
function readPhoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){
      var k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- Pronta entrega ---------- */
function stockList(){
  var q=norm(T.q.stock);
  return S.stock.filter(function(r){return r.qty>0}).map(function(r){return {r:r,p:prod(r.pid)}}).filter(function(x){return x.p})
    .filter(function(x){return !q||norm([x.p.name,x.r.color,x.r.size].join(' ')).indexOf(q)>-1})
    .sort(function(a,b){return a.p.name.localeCompare(b.p.name,'pt-BR')||a.r.color.localeCompare(b.r.color,'pt-BR')||a.r.size.localeCompare(b.r.size,'pt-BR',{numeric:true})});
}
function vStock(){

function slSum(){var t=0;SL.lines.forEach(function(l){t+=l.qty*l.price});return Math.round(t*100)/100}
function slDiscCents(){var cp=cpById(SL.cp);if(!cp)return 0;var g=Math.round(slSum()*100),d=cp.type==='pct'?Math.round(g*cp.val/100):Math.round(cp.val*100);return Math.max(0,Math.min(g,d))}
function slNet(){return (Math.round(slSum()*100)-slDiscCents())/100}
function distDisc(){var D=slDiscCents(),ls=SL.lines.map(function(l){return Math.round(l.qty*l.price*100)}),g=ls.reduce(function(a,b){return a+b},0),out=[],used=0;ls.forEach(function(lc,i){var d=i===ls.length-1?D-used:(g?Math.floor(D*lc/g):0);out.push(d);used+=d});return out}
function slTotal(){var e=$('#sl-total');if(e)e.textContent=brl(slNet());var dd=$('#sl-disc'),D=slDiscCents(),cp=cpById(SL.cp);if(dd)dd.textContent=D>0?'Desconto do cupom '+cp.name+': −'+brl(D/100)+' (de '+brl(slSum())+')':'';if(!SL.paid){instSplit();drawInst()}}
function instSplit(force){
  if(!SL.eq&&!force)return;
  var c=Math.round(slNet()*100),n=SL.n,b=Math.floor(c/n),r=c-b*n;
  SL.inst.forEach(function(x,i){x.val=(b+(i<r?1:0))/100});
}
function instInit(){
  var old=SL.inst,now=new Date();SL.inst=[];
  for(var i=0;i<SL.n;i++)SL.inst.push({due:old[i]?old[i].due:ymd(addMonths(now,i+1)),val:0});
  instSplit(true);
}
function drawInst(){
  var el=$('#sl-inst');if(!el||SL.paid)return;
  el.innerHTML=SL.inst.map(function(x,i){return '<div class="two-f"><label class="fld"><span>Parcela '+(i+1)+'/'+SL.n+' · vence</span><input type="date" value="'+x.due+'" data-on="slDue" data-i="'+i+'"></label><label class="fld"><span>Valor (R$)</span><input type="text" inputmode="decimal" value="'+fmtNum(x.val)+'" data-on="slVal" data-i="'+i+'"'+(SL.eq?' readonly':'')+'></label></div>'}).join('');

function slDiff(){
  var d=$('#sl-diff');if(!d)return;var sm=0;SL.inst.forEach(function(x){sm+=x.val});var df=Math.round((slNet()-sm)*100)/100;
  d.textContent=df===0?'':(df>0?'Faltam '+brl(df)+' para fechar o total.':'As parcelas passam '+brl(-df)+' do total.');d.style.color='var(--warn)';

function sellGo(){
  var c;
  if(SL.cid==='__new'){var n=SL.newName.trim();if(!n){toast('Digite o nome do cliente');return}c={id:uid(),name:n,phone:'',comments:[],buys:[]}}
  else{c=client(SL.cid);if(!c){toast('Escolha o cliente');return}}
  if(!SL.paid){var sm=0;for(var j=0;j<SL.inst.length;j++){if(!SL.inst[j].due){toast('Escolha o vencimento de cada parcela');return}sm+=SL.inst[j].val}if(Math.abs(sm-slNet())>0.011){toast('A soma das parcelas precisa ser igual ao total');return}}
  var need={};
  SL.lines.forEach(function(l){need[l.rid]=(need[l.rid]||0)+l.qty});
  for(var k in need){var r=srow(k);if(!r||r.qty<need[k]){toast('Quantidade maior que o estoque');return}}
  if(SL.cid==='__new')S.clients.push(c);
  var t=Date.now(),n2=0,sid=SL.paid?undefined:uid(),ds=distDisc(),cpn=cpById(SL.cp);
  SL.lines.forEach(function(l,ix){var r=srow(l.rid),p=prod(r.pid);r.qty-=l.qty;n2+=l.qty;
    var bb={id:uid(),t:t,pid:p.id,name:p.name,color:r.color,size:r.size,qty:l.qty,price:l.price,paid:SL.paid,sid:sid};if(ds[ix]>0){bb.disc=ds[ix]/100;bb.cup=cpn.name}c.buys.push(bb)});
  if(sid){c.parc=c.parc||[];SL.inst.forEach(function(x,i){c.parc.push({id:uid(),sid:sid,i:i+1,n:SL.n,due:x.due,val:x.val,paid:false})})}
  S.stock=S.stock.filter(function(r){return r.qty>0});
  save();closeSheet();T.sel.clear();T.selMode=false;toast(n2+(n2>1?' peças enviadas':' peça enviada')+' para '+c.name);render();
}

function addMonths(d,k){var x=new Date(d.getFullYear(),d.getMonth()+k,1),l=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),l));return x}

function dayData(){
  var hj=ymd(new Date()),ym=hj.slice(0,7),r={today:{sum:0,n:0,by:{}},late:{sum:0,n:0,by:{}},month:{sum:0,n:0,by:{}}};
  S.clients.forEach(function(c){(c.parc||[]).forEach(function(p){
    var v=pend(p);if(p.paid||v<=0)return;
    function add(k){var o=r[k];o.sum+=v;o.n++;var b=o.by[c.id]||(o.by[c.id]={c:c,sum:0,n:0,due:p.due});b.sum+=v;b.n++;if(p.due<b.due)b.due=p.due}
    if(p.due===hj)add('today');if(p.due<hj)add('late');if(p.due.slice(0,7)===ym)add('month');
  })});
  Object.keys(r).forEach(function(k){r[k].sum=Math.round(r[k].sum*100)/100});
  return r;
}
function daySummary(){
  var el=$('#dsum');if(!el)return;var d=dayData();

  el.innerHTML='<div class="dsum">'+tl.map(function(t){var o=d[t[0]];return '<button class="dt'+(t[2]&&o.n?' '+t[2]:'')+'" data-act="sumOpen" data-k="'+t[0]+'"><small>'+t[1]+'</small><strong>'+(o.n?brl(o.sum):'—')+'</strong><em>'+(o.n?o.n+(o.n>1?' parcelas':' parcela'):'nenhuma')+'</em></button>'}).join('')+'</div>';

function sumSheet(k){
  var d=dayData()[k],hj=ymd(new Date());
  if(!d.n){toast(k==='today'?'Nada vence hoje':k==='late'?'Nenhuma parcela atrasada':'Nada a receber neste mês');return}
  var arr=Object.keys(d.by).map(function(id){return d.by[id]}).sort(function(a,b){return a.due<b.due?-1:1});
  var ttl=k==='today'?'Vence hoje':k==='late'?'Atrasadas':'A receber em '+new Date().toLocaleDateString('pt-BR',{month:'long'});
  sheet(ttl,'<div class="totbar"><span>Total</span><span>'+brl(d.sum)+'</span></div><div class="list">'+arr.map(function(x){
    var sub=k==='late'?'desde '+fmtD(x.due):k==='today'?'vence hoje':'a partir de '+fmtD(x.due);
    return '<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="mid"><b>'+esc(x.c.name)+'</b><small class="num">'+x.n+(x.n>1?' parcelas':' parcela')+' · '+sub+'</small><span class="num">'+brl(x.sum)+'</span></div><button class="btn sm pri" data-act="cobrar" data-id="'+x.c.id+'">Cobrar</button></div>'}).join('')+'</div>');

function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function wrap(ctx,text,maxW,maxLines){
  var words=String(text).split(/\s+/),lines=[],cur='';
  for(var i=0;i<words.length;i++){var t=cur?cur+' '+words[i]:words[i];if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i]}else cur=t}
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);var l=lines[maxLines-1];while(l.length>1&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);lines[maxLines-1]=l+'…'}
  return lines;
}
function ellip(ctx,text,maxW){while(text.length>1&&ctx.measureText(text).width>maxW)text=text.slice(0,-1);return text}
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    var tl,tr,br,bl;if(Array.isArray(r)){tl=r[0]||0;tr=r[1]||0;br=r[2]||0;bl=r[3]||0}else{tl=tr=br=bl=r||0}
    this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.arcTo(x+w,y,x+w,y+tr,tr);this.lineTo(x+w,y+h-br);this.arcTo(x+w,y+h,x+w-br,y+h,br);
    this.lineTo(x+bl,y+h);this.arcTo(x,y+h,x,y+h-bl,bl);this.lineTo(x,y+tl);this.arcTo(x,y,x+tl,y,tl);this.closePath();
  };
}
async function buildCatalog(){
  var items=S.products.filter(function(p){return p.cat});
  try{await document.fonts.ready}catch(e){}
  var W=1080,pad=48,gap=32,cw=(W-pad*2-gap)/2,info=170,head=210,rows=Math.ceil(items.length/2),H=head+rows*(cw+info+gap)+pad-gap+gap;
  var sc=Math.min(1,Math.sqrt(12000000/(W*H)));
  var cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);var x=cv.getContext('2d');x.scale(sc,sc);
  var F='"Bricolage Grotesque","DM Sans",system-ui,sans-serif',B='"DM Sans",system-ui,sans-serif';
  x.fillStyle=pal().bg;x.fillRect(0,0,W,H);
  x.fillStyle=pal().a;x.fillRect(0,0,W,head-30);
  x.fillStyle='#FFFFFF';x.textBaseline='alphabetic';
  x.font='700 64px '+F;x.fillText(ellip(x,S.shop||'Catálogo',W-pad*2),pad,100);
  x.font='500 30px '+B;x.globalAlpha=.85;x.fillText('Catálogo de produtos · '+items.length+(items.length===1?' item':' itens'),pad,150);x.globalAlpha=1;
  var imgs=await Promise.all(items.map(function(p){return p.photo?loadImg(p.photo):Promise.resolve(null)}));
  items.forEach(function(p,i){
    var cx=pad+(i%2)*(cw+gap),cy=head+Math.floor(i/2)*(cw+info+gap);
    x.fillStyle='#FFFFFF';x.beginPath();x.roundRect(cx,cy,cw,cw+info,28);x.fill();
    x.save();x.beginPath();x.roundRect(cx,cy,cw,cw,[28,28,0,0]);x.clip();
    var im=imgs[i];
    if(im){var s=Math.max(cw/im.width,cw/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,cx+(cw-w)/2,cy+(cw-h)/2,w,h)}
    else{x.fillStyle=pal().s2;x.fillRect(cx,cy,cw,cw);x.fillStyle=pal().mu;x.font='700 160px '+F;x.textAlign='center';x.fillText((p.name[0]||'?').toUpperCase(),cx+cw/2,cy+cw/2+55);x.textAlign='left'}
    x.restore();
    x.fillStyle=pal().ink;x.font='600 32px '+B;
    var nl=wrap(x,p.name,cw-48,2);nl.forEach(function(l,k){x.fillText(l,cx+24,cy+cw+46+k*38)});
    x.fillStyle=pal().a;x.font='700 44px '+F;x.fillText(brl(p.price),cx+24,cy+cw+46+(nl.length-1)*38+54);
    var vs=[];if(p.colors.length)vs.push(p.colors.join(', '));if(p.sizes.length)vs.push(p.sizes.join(', '));
    if(vs.length){x.fillStyle=pal().mu;x.font='500 24px '+B;x.fillText(ellip(x,vs.join(' · '),cw-48),cx+24,cy+cw+info-18)}
  });
  return cv.toDataURL('image/jpeg',.9);
}

  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.kind){e.preventDefault();chipAdd(e.target.dataset.kind)}
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[role=button]')){e.preventDefault();e.target.click()}
  else if(e.key==='Escape')closeSheet();
});

/* ===== Acesso e planos. MODO TESTE: conta e cupons são só do aparelho, nada é conferido num servidor. ===== */
var CODES={
  '100':{label:'Entrada livre por 1 mês liberada',ms:30*864e5,warn:3*864e5},
  '1':{label:'Acesso de 1 dia liberado',ms:864e5,warn:2*36e5},
  '2min':{label:'Teste rápido de 2 minutos liberado',ms:12e4,warn:6e4},
  'travar':{label:'Acesso travado',ms:0,warn:0}
};
var ACC=null,SESS=false,G={view:null,mode:'create',last:'',email:''},accMem={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return accMem[k]||null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}accMem[k]=v}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}delete accMem[k]}
function accLoad(){var j=lsGet('catalogo-conta');try{ACC=j?JSON.parse(j):null}catch(e){ACC=null}SESS=lsGet('catalogo-sessao')==='1'&&!!ACC}
function accSave(){if(ACC)lsSet('catalogo-conta',JSON.stringify(ACC));else lsDel('catalogo-conta')}
function sessSet(v){SESS=v;if(v)lsSet('catalogo-sessao','1');else lsDel('catalogo-sessao')}
function accHash(email,pass){
  var txt=email.trim().toLowerCase()+':'+pass;
  if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});
  return Promise.resolve('b64:'+btoa(unescape(encodeURIComponent(txt))));
}
function accStatus(){
  if(!ACC||!SESS)return 'auth';
  if(!ACC.exp)return 'plans';
  var left=ACC.exp-Date.now();
  if(left<=0)return 'lock';
  return left<=(ACC.warn||0)?'warn':'ok';
}
function fmtLeft(ms){var s=Math.max(0,Math.ceil(ms/1000));if(s>=172800)return Math.floor(s/86400)+' dias';var h=Math.floor(s/3600),m=Math.floor(s%3600/60);if(h>=1)return h+'h '+String(m).padStart(2,'0')+'min';if(m>=1)return m+' min '+String(s%60).padStart(2,'0')+'s';return s+' s'}
function accApply(code){
  var k=String(code||'').trim().toLowerCase(),c=CODES[k];
  if(!c)return null;
  ACC.code=k;ACC.plan='solo';ACC.exp=Date.now()+c.ms;ACC.warn=c.warn||0;accSave();return c;
}
function viewAuth(){
  var cr=G.mode==='create';
  return '<div class="gw"><div class="gtop"><span class="gbrand">Catálogo</span></div>'
    +'<h1 class="gh">'+(cr?'Crie sua conta':'Entre na sua conta')+'</h1>'
    +'<div class="gnote">Modo de teste. Nada é enviado a nenhum servidor, então pode usar um e-mail e uma senha inventados.</div>'
    +'<div class="seg"><button class="'+(cr?'on':'')+'" data-act="gMode" data-v="create">Criar conta</button><button class="'+(cr?'':'on')+'" data-act="gMode" data-v="login">Entrar</button></div>'
    +'<label class="fld"><span>E-mail</span><input id="g-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" placeholder="voce@exemplo.com" value="'+esc(G.email)+'"></label>'
    +'<label class="fld"><span>Senha</span><input id="g-pass" type="password" autocomplete="off" placeholder="Pelo menos 4 caracteres" data-enter="1"></label>'
    +'<button class="btn pri block" data-act="gAuth" data-enter="1">'+(cr?'Criar conta':'Entrar')+'</button>'
    +'<button class="link" style="color:var(--muted);justify-self:start;text-align:left" data-act="gReset">Esqueci a senha ou quero começar de novo</button></div>';
}
function viewPlans(){
  var st=accStatus(),back=st!=='plans';
  return '<div class="gw"><div class="gtop">'+(back?'<button class="btn sm" data-act="gBack">‹ Voltar</button>':'<span class="gbrand">Catálogo</span>')+'<button class="btn sm" data-act="gCoupon">Cupom</button></div>'
    +'<h1 class="gh">Escolha seu plano</h1>'
    +'<div class="gnote">Modo de teste: o pagamento ainda não está ligado. Os dois planos liberam o Solo quando você usa um cupom.</div>'
    +'<div class="plan feat"><span class="tag">Para uma pessoa</span><h3>Solo</h3><div class="pr">R$ 111,00 <small>/ mês (valor de exemplo)</small></div><ul>'
    +'<li>Catálogo, pronta entrega e clientes sem limite</li><li>Parcelas, pagamento parcial e cobrança pelo WhatsApp</li><li>Cupons de desconto e foto com preço para enviar ao cliente</li><li>Dados guardados no seu aparelho, com backup</li><li>1 pessoa usando</li></ul>'
    +'<button class="btn pri block" data-act="gPick" data-p="solo">Escolher o Solo</button></div>'
    +'<div class="plan"><span class="tag">Para duas ou mais pessoas</span><h3>Compartilhado</h3><div class="pr">A definir</div><ul>'
    +'<li>Tudo que o plano Solo tem</li><li class="soon">Várias pessoas no mesmo catálogo e estoque (em breve)</li><li class="soon">Clientes e vendas iguais em todos os aparelhos (em breve)</li><li class="soon">Cada pessoa entra com a sua conta (em breve)</li></ul>'
    +'<button class="btn block" data-act="gPick" data-p="shared">Escolher o Compartilhado</button></div>'
    +(st==='plans'?'<button class="link" style="color:var(--muted);justify-self:start" data-act="gLogout">Sair da conta ('+esc(ACC.email)+')</button>':'')+'</div>';
}
function viewLock(){
  var why=ACC.code==='travar'?'Este acesso foi travado pelo cupom “travar”, que existe só para testar o bloqueio.':'Seu acesso terminou em '+fmtDT(ACC.exp)+'.';
  return '<div class="gw"><div class="gtop"><span class="gbrand">Catálogo</span><button class="btn sm" data-act="gCoupon">Cupom</button></div>'
    +'<h1 class="gh">Acesso bloqueado</h1><p class="muted" style="margin:0">'+esc(why)+' Seus produtos, estoque e clientes continuam guardados neste aparelho.</p>'
    +'<button class="btn pri block" data-act="gCoupon">Inserir cupom</button><button class="btn block" data-act="gPlans">Ver planos</button>'
    +'<div class="card2"><h3>Seus dados</h3><p>Você pode salvar um backup mesmo com o acesso bloqueado.</p><button class="btn" data-act="bkSave">Salvar backup</button><button class="btn" data-act="bkCopy">Ver texto do backup para copiar</button></div>'
    +'<button class="link" style="color:var(--muted);justify-self:start" data-act="gLogout">Sair da conta ('+esc(ACC.email)+')</button></div>';
}
function gateRender(){
  var st=accStatus(),v=G.view;
  if(st==='auth')v='auth';else if(st==='plans')v='plans';else if(st==='lock'&&v!=='plans')v='lock';else if(st!=='lock'&&v!=='plans')v=null;
  G.last=st;
  var g=document.getElementById('gate');
  if(!v){if(g)g.remove();return}
  if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  g.innerHTML=v==='auth'?viewAuth():v==='plans'?viewPlans():viewLock();g.scrollTop=0;
}
function accTxt(){var e=document.getElementById('acctxt');if(e&&ACC)e.textContent='Seu acesso acaba em '+fmtLeft(ACC.exp-Date.now())+'. Depois disso o app bloqueia.'}
function accBanner(){
  var old=document.getElementById('accbar');if(old)old.remove();
  if(accStatus()!=='warn')return;var m=$('#main');if(!m)return;
  m.insertAdjacentHTML('afterbegin','<div id="accbar" class="banner accbar"><span id="acctxt"></span><button class="btn sm" data-act="gPlans">Planos</button></div>');accTxt();
}
function gateTick(){
  var st=accStatus();
  if(st!==G.last){if(st==='lock')closeSheet();if(st!=='ok'&&st!=='warn')G.view=null;gateRender();accBanner()}
  else if(st==='warn')accTxt();
}
function couponSheet(title,intro){
  sheet(title,'<p class="muted" style="margin:0">'+esc(intro)+'</p><label class="fld"><span>Cupom</span><input id="g-cup" type="text" autocomplete="off" autocapitalize="off" placeholder="Digite o cupom" data-enter="1"></label><small id="g-cerr" style="color:var(--danger)"></small><button class="btn pri block" data-act="gCouponGo" data-enter="1">Aplicar cupom</button>');
  setTimeout(function(){var i=$('#g-cup');if(i)i.focus()},60);
}
function accCard(){
  if(!ACC)return '';var st=accStatus(),t;
  if(!ACC.exp)t='Nenhum plano ativo ainda.';
  else if(st==='lock')t='Acesso bloqueado desde '+fmtDT(ACC.exp)+'.';
  else t='Acesso liberado até '+fmtDT(ACC.exp)+(ACC.code?' (cupom '+ACC.code+')':'')+'.';
  return '<div class="card2"><h3>Meu plano</h3><p>'+esc(ACC.email)+(ACC.exp?' · Plano Solo':'')+'</p><p>'+esc(t)+'</p><p>Modo de teste: a conta e os cupons ficam só neste aparelho.</p><button class="btn pri" data-act="gCoupon">Inserir cupom de acesso</button><button class="btn" data-act="gPlans">Ver planos</button><button class="btn" data-act="gLogout">Sair da conta</button><button class="btn dng" data-act="gReset">Apagar conta de teste</button></div>';
}
A.gMode=function(el){var i=$('#g-email');if(i)G.email=i.value;G.mode=el.dataset.v;gateRender()};
A.gAuth=function(){
  var em=($('#g-email').value||'').trim(),pw=$('#g-pass').value||'';G.email=em;
  if(!/^\S+@\S+\.\S+$/.test(em)){toast('Digite um e-mail (pode ser inventado)');return}
  if(pw.length<4){toast('A senha precisa ter 4 caracteres ou mais');return}
  accHash(em,pw).then(function(h){
    if(G.mode==='create'){
      if(ACC){toast('Já existe uma conta de teste neste aparelho. Toque em Entrar.');return}
      ACC={email:em,hash:h,exp:0,warn:0,code:'',plan:'',pick:''};accSave();sessSet(true);G.view=null;gateRender();toast('Conta criada');
    }else{
      if(!ACC){toast('Nenhuma conta neste aparelho. Toque em Criar conta.');return}
      if(ACC.email.toLowerCase()!==em.toLowerCase()||ACC.hash!==h){toast('E-mail ou senha incorretos');return}
      sessSet(true);G.view=null;gateRender();accBanner();
    }
  });
};
A.gLogout=function(){sessSet(false);G.view=null;G.mode='login';G.email=ACC?ACC.email:'';closeSheet();gateRender();accBanner()};
A.gReset=function(el){twoTap(el,function(){ACC=null;sessSet(false);accSave();G.view=null;G.mode='create';G.email='';closeSheet();gateRender();accBanner();toast('Conta de teste apagada. Os dados do app continuam aqui.')})};
A.gPlans=function(){closeSheet();G.view='plans';gateRender()};
A.gBack=function(){G.view=null;gateRender();accBanner()};
A.gPick=function(el){
  if(ACC)ACC.pick=el.dataset.p;accSave();
  couponSheet('Pagamento',el.dataset.p==='shared'?'O pagamento ainda não está ligado e o plano Compartilhado ainda não existe de verdade. Neste teste, um cupom libera o plano Solo.':'O pagamento ainda não está ligado neste teste. Use um cupom para liberar o plano Solo.');
};
A.gCoupon=function(){couponSheet('Cupom de acesso','Digite o cupom para liberar o app.')};
A.gCouponGo=function(){
  var c=ACC?accApply($('#g-cup').value):null;
  if(!c){var e=$('#g-cerr');if(e)e.textContent='Cupom não encontrado. Confira o que foi digitado.';return}
  closeSheet();G.view=null;gateRender();accBanner();toast(c.label);
};
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target||e.target.tagName!=='INPUT')return;
  var box=e.target.closest('.sheet,#gate'),b=box&&box.querySelector('[data-enter]');if(b&&e.target.type!=='checkbox'){e.preventDefault();b.click()}
});
function gateInit(){
  accLoad();G.mode=ACC?'login':'create';G.email=ACC?ACC.email:'';gateRender();
  setInterval(gateTick,5000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')gateTick()});
}
function start(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  gateInit();
  try{render()}catch(e){showErr(e.message)}
  initDownloads();
  load().then(function(){applyTheme();try{render()}catch(e){showErr(e.message)}}).catch(function(){});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();


try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}
</script>
