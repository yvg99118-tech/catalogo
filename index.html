<style>
/* Layout: app de uma tela (cabeçalho, conteúdo rolável, barra de abas). Folhas de ação sobem de baixo. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE8; --ink:#12302A; --muted:#5A716B; --line:#D2DEDA;
  --accent:#0F7A68; --accent-ink:#FFFFFF; --warn:#B8420F; --warn-bg:#FCE7DC; --ok:#1C7A3A; --ok-bg:#DAF1E1; --danger:#B42318;
  --shadow:0 -8px 30px rgba(18,48,42,.18);
  --f-display:"Bricolage Grotesque","DM Sans",system-ui,-apple-system,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A17; --surface:#15251F; --surface2:#1D3029; --ink:#E5F0EC; --muted:#93AAA3; --line:#2A403A;
    --accent:#3CC2A8; --accent-ink:#06211B; --warn:#FF9C6E; --warn-bg:#3A2218; --ok:#6FD38B; --ok-bg:#17301F; --danger:#FF8A7A;
    --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A17; --surface:#15251F; --surface2:#1D3029; --ink:#E5F0EC; --muted:#93AAA3; --line:#2A403A;
  --accent:#3CC2A8; --accent-ink:#06211B; --warn:#FF9C6E; --warn-bg:#3A2218; --ok:#6FD38B; --ok-bg:#17301F; --danger:#FF8A7A;
  --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small,.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:720px;margin:0 auto}
#hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
#hd h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;text-wrap:balance;min-width:0}
.acts{display:flex;gap:8px;flex-shrink:0}
#main{overflow-y:auto;overflow-x:hidden;padding-bottom:20px;-webkit-overflow-scrolling:touch;min-width:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0 6px;border-top:1px solid var(--line);background:var(--bg)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--ink);min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn.dng{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:12px}
.search:focus{border-color:var(--accent);outline:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);min-width:0}
.card .ph{aspect-ratio:1/1;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--muted);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .cb b{font-weight:600;overflow-wrap:anywhere}
.price{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.card .btn{margin:6px 10px 10px;min-height:38px;font-size:13.5px;padding:8px 8px}
.card .btn.on{background:var(--ok-bg);color:var(--ok)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;font-family:var(--f-display);font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;min-width:0}
.sum div:nth-child(2){background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sum small{display:block;color:inherit;opacity:.8;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sum strong{font-family:var(--f-display);font-size:25px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sumnote{margin:-4px 0 12px;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.row.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.th{width:52px;height:52px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.th .ck{position:absolute;inset:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px}
.mid{min-width:0;display:grid;gap:3px}
.mid b{font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--surface2);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500}
.chip.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.right{text-align:right;display:grid;gap:2px}
.qty{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.selbar{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:8px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .two div{background:var(--surface2);border-radius:12px;padding:9px 12px;min-width:0}
.hero .two div.owe{background:var(--warn-bg);color:var(--warn)}
.hero .two small{display:block;color:inherit;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.hero .two strong{font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums}
.day{margin:14px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:6px}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--danger);font-weight:600;padding:4px 0;font-size:13px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.card2 h3{margin:0;font-family:var(--f-display);font-size:18px}
.card2 p{margin:0;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:500}
.ms{margin:0 0 12px}.msh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.msh b{font-size:14px}.msh .x{width:32px;height:32px}
.msg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.mb{flex:0 0 auto;min-width:72px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px;display:grid;gap:1px;text-align:center}
.mb small{font-weight:600}.mb strong{font-family:var(--f-display);font-size:14px;font-variant-numeric:tabular-nums}
.mb.has{border-color:var(--accent)}.mb.cur small{color:var(--accent)}
/* Folhas de ação */
.ov{position:fixed;inset:0;background:rgba(8,20,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.01em;text-wrap:balance;min-width:0}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:18px;line-height:1;flex-shrink:0}
.fld{display:grid;gap:5px;min-width:0}
.fld>span,.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:0}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:84px;height:84px;border-radius:16px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex-shrink:0;font-size:12px;text-align:center}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.addrow{display:flex;gap:8px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 11px;font-weight:500;font-size:14px}
.chipx button{border:0;background:var(--surface);border-radius:50%;width:22px;height:22px;line-height:1;font-size:13px}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step .btn{font-size:22px;padding:0;min-height:48px}
.step output{text-align:center;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.line .tot{display:flex;justify-content:space-between;align-items:center}
.totbar{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.shareimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
textarea.inp{min-height:110px;resize:vertical}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

<div id="app">
  <header id="hd"></header>
  <main id="main"><div class="empty" style="margin-top:12px"><h3>Abrindo o app…</h3></div></main>
  <nav id="tabs">
    <button class="tab" data-act="tab" data-tab="prod"><svg viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>Produtos</button>
    <button class="tab" data-act="tab" data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Pronta entrega</button>
    <button class="tab" data-act="tab" data-tab="cli"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Clientes</button>
    <button class="tab" data-act="tab" data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var brl=function(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)};
var fmtNum=function(n){return (Number(n)||0).toFixed(2).replace('.',',')};
var parseNum=function(v){v=String(v==null?'':v).trim().replace(/[^\d,.\-]/g,'');if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:0};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};
var fmtDate=function(t){return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})};
var fmtDT=function(t){var d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
var initial=function(s){return esc((String(s||'?').trim()[0]||'?').toUpperCase())};

/* ---------- Estado e armazenamento ---------- */
var S={v:1,shop:'',products:[],stock:[],clients:[]};
var storageOK=true,saveTimer=null;
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('catalogo-pronta-entrega',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
function normalize(o){
  o=o&&typeof o==='object'?o:{};
  return {v:1,shop:String(o.shop||''),
    products:(Array.isArray(o.products)?o.products:[]).map(function(p){return {id:p.id||uid(),name:String(p.name||'Sem nome'),price:Number(p.price)||0,photo:p.photo||'',cat:!!p.cat,colors:Array.isArray(p.colors)?p.colors:[],sizes:Array.isArray(p.sizes)?p.sizes:[]}}),
    stock:(Array.isArray(o.stock)?o.stock:[]).map(function(r){return {id:r.id||uid(),pid:r.pid,color:r.color||'',size:r.size||'',qty:Math.max(0,parseInt(r.qty,10)||0)}}),
    clients:(Array.isArray(o.clients)?o.clients:[]).map(function(c){return {id:c.id||uid(),name:String(c.name||'Sem nome'),phone:String(c.phone||''),comments:Array.isArray(c.comments)?c.comments:[],buys:Array.isArray(c.buys)?c.buys:[],parc:Array.isArray(c.parc)?c.parc:[]}})};
}
function writeNow(){
  var json=JSON.stringify(S);
  idbSet('state',json).then(function(){storageOK=true}).catch(function(){
    try{localStorage.setItem('catalogo-state',json);storageOK=true}catch(e){storageOK=false}
  }).then(function(){var b=$('#bn');if(b)b.hidden=storageOK});
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){saveTimer=null;writeNow()},250);
}
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;writeNow()}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);
function load(){
  return idbGet('state').catch(function(){return null}).then(function(v){
    if(!v){try{v=localStorage.getItem('catalogo-state')}catch(e){v=null}}
    if(v){try{S=normalize(JSON.parse(v))}catch(e){}}
  });
}
var dl=null;
function initDownloads(){
  dl={save:function(o){
    var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.json$/.test(o.filename)?'application/json':'text/plain'});
    var file=null;try{file=new File([blob],o.filename,{type:blob.type})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:o.filename}).catch(function(e){throw {code:(e&&e.name==='AbortError')?'declined':'unavailable'}});
    }
    if(navigator.standalone===true)return Promise.reject({code:'unavailable'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},1500);return Promise.resolve();
  }};
}
function showErr(msg){
  var b=document.getElementById('errbar');
  if(!b){b=document.createElement('div');b.id='errbar';b.className='banner';b.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99';document.body.appendChild(b)}
  b.textContent='Erro: '+msg;
}
window.addEventListener('error',function(ev){showErr(ev.message||'desconhecido')});

var SL=null;

    +'<button class="btn pri block" data-act="sellGo">Registrar venda</button>');

function drawLines(){
  $('#sl-lines').innerHTML=SL.lines.map(function(l,i){
    var r=srow(l.rid),p=prod(r.pid),opts='';
    if(hasVar(p)){
      opts='<label class="fld"><span>Variação</span><select data-on="slVar" data-i="'+i+'">'+S.stock.filter(function(x){return x.pid===p.id&&x.qty>0}).map(function(x){return '<option value="'+x.id+'" '+(x.id===l.rid?'selected':'')+'>'+esc(varLabel(x)||'Padrão')+' ('+x.qty+' em estoque)</option>'}).join('')+'</select></label>';

      +'<label class="fld"><span>Preço un. (R$)</span><input type="text" inputmode="decimal" value="'+fmtNum(l.price)+'" data-on="slPrice" data-i="'+i+'"></label></div></div>';
  }).join('');

function slSum(){var t=0;SL.lines.forEach(function(l){t+=l.qty*l.price});return Math.round(t*100)/100}
function slTotal(){var e=$('#sl-total');if(e)e.textContent=brl(slSum());if(!SL.paid){instSplit();drawInst()}}
function instSplit(force){
  if(!SL.eq&&!force)return;
  var c=Math.round(slSum()*100),n=SL.n,b=Math.floor(c/n),r=c-b*n;
  SL.inst.forEach(function(x,i){x.val=(b+(i<r?1:0))/100});
}
function instInit(){
  var old=SL.inst,now=new Date();SL.inst=[];
  for(var i=0;i<SL.n;i++)SL.inst.push({due:old[i]?old[i].due:ymd(addMonths(now,i+1)),val:0});
  instSplit(true);
}
function drawInst(){
  var el=$('#sl-inst');if(!el||SL.paid)return;
  el.innerHTML=SL.inst.map(function(x,i){return '<div class="two-f"><label class="fld"><span>Parcela '+(i+1)+'/'+SL.n+' · vence</span><input type="date" value="'+x.due+'" data-on="slDue" data-i="'+i+'"></label><label class="fld"><span>Valor (R$)</span><input type="text" inputmode="decimal" value="'+fmtNum(x.val)+'" data-on="slVal" data-i="'+i+'"'+(SL.eq?' readonly':'')+'></label></div>'}).join('');
  slDiff();
}
function slDiff(){
  var d=$('#sl-diff');if(!d)return;var sm=0;SL.inst.forEach(function(x){sm+=x.val});var df=Math.round((slSum()-sm)*100)/100;
  d.textContent=df===0?'':(df>0?'Faltam '+brl(df)+' para fechar o total.':'As parcelas passam '+brl(-df)+' do total.');d.style.color='var(--warn)';
}
function sellGo(){
  var c;
  if(SL.cid==='__new'){var n=SL.newName.trim();if(!n){toast('Digite o nome do cliente');return}c={id:uid(),name:n,phone:'',comments:[],buys:[]}}
  else{c=client(SL.cid);if(!c){toast('Escolha o cliente');return}}
  if(!SL.paid){var sm=0;for(var j=0;j<SL.inst.length;j++){if(!SL.inst[j].due){toast('Escolha o vencimento de cada parcela');return}sm+=SL.inst[j].val}if(Math.abs(sm-slSum())>0.011){toast('A soma das parcelas precisa ser igual ao total');return}}
  var need={};
  SL.lines.forEach(function(l){need[l.rid]=(need[l.rid]||0)+l.qty});
  for(var k in need){var r=srow(k);if(!r||r.qty<need[k]){toast('Quantidade maior que o estoque');return}}
  if(SL.cid==='__new')S.clients.push(c);
  var t=Date.now(),n2=0,sid=SL.paid?undefined:uid();
  SL.lines.forEach(function(l){var r=srow(l.rid),p=prod(r.pid);r.qty-=l.qty;n2+=l.qty;
    c.buys.push({id:uid(),t:t,pid:p.id,name:p.name,color:r.color,size:r.size,qty:l.qty,price:l.price,paid:SL.paid,sid:sid})});
  if(sid){c.parc=c.parc||[];SL.inst.forEach(function(x,i){c.parc.push({id:uid(),sid:sid,i:i+1,n:SL.n,due:x.due,val:x.val,paid:false})})}
  S.stock=S.stock.filter(function(r){return r.qty>0});
  save();closeSheet();T.sel.clear();T.selMode=false;toast(n2+(n2>1?' peças enviadas':' peça enviada')+' para '+c.name);render();
}

}

function loadImg(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function wrap(ctx,text,maxW,maxLines){
  var words=String(text).split(/\s+/),lines=[],cur='';
  for(var i=0;i<words.length;i++){var t=cur?cur+' '+words[i]:words[i];if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=words[i]}else cur=t}
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);var l=lines[maxLines-1];while(l.length>1&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);lines[maxLines-1]=l+'…'}
  return lines;
}
function ellip(ctx,text,maxW){while(text.length>1&&ctx.measureText(text).width>maxW)text=text.slice(0,-1);return text}
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    var tl,tr,br,bl;if(Array.isArray(r)){tl=r[0]||0;tr=r[1]||0;br=r[2]||0;bl=r[3]||0}else{tl=tr=br=bl=r||0}
    this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.arcTo(x+w,y,x+w,y+tr,tr);this.lineTo(x+w,y+h-br);this.arcTo(x+w,y+h,x+w-br,y+h,br);
    this.lineTo(x+bl,y+h);this.arcTo(x,y+h,x,y+h-bl,bl);this.lineTo(x,y+tl);this.arcTo(x,y,x+tl,y,tl);this.closePath();
  };
}
async function buildCatalog(){
  var items=S.products.filter(function(p){return p.cat});
  try{await document.fonts.ready}catch(e){}
  var W=1080,pad=48,gap=32,cw=(W-pad*2-gap)/2,info=170,head=210,rows=Math.ceil(items.length/2),H=head+rows*(cw+info+gap)+pad-gap+gap;
  var sc=Math.min(1,Math.sqrt(12000000/(W*H)));
  var cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);var x=cv.getContext('2d');x.scale(sc,sc);
  var F='"Bricolage Grotesque","DM Sans",system-ui,sans-serif',B='"DM Sans",system-ui,sans-serif';
  x.fillStyle='#EEF3F1';x.fillRect(0,0,W,H);
  x.fillStyle='#0F7A68';x.fillRect(0,0,W,head-30);
  x.fillStyle='#FFFFFF';x.textBaseline='alphabetic';
  x.font='700 64px '+F;x.fillText(ellip(x,S.shop||'Catálogo',W-pad*2),pad,100);
  x.font='500 30px '+B;x.globalAlpha=.85;x.fillText('Catálogo de produtos · '+items.length+(items.length===1?' item':' itens'),pad,150);x.globalAlpha=1;
  var imgs=await Promise.all(items.map(function(p){return p.photo?loadImg(p.photo):Promise.resolve(null)}));
  items.forEach(function(p,i){
    var cx=pad+(i%2)*(cw+gap),cy=head+Math.floor(i/2)*(cw+info+gap);
    x.fillStyle='#FFFFFF';x.beginPath();x.roundRect(cx,cy,cw,cw+info,28);x.fill();
    x.save();x.beginPath();x.roundRect(cx,cy,cw,cw,[28,28,0,0]);x.clip();
    var im=imgs[i];
    if(im){var s=Math.max(cw/im.width,cw/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,cx+(cw-w)/2,cy+(cw-h)/2,w,h)}
    else{x.fillStyle='#E2EBE8';x.fillRect(cx,cy,cw,cw);x.fillStyle='#5A716B';x.font='700 160px '+F;x.textAlign='center';x.fillText((p.name[0]||'?').toUpperCase(),cx+cw/2,cy+cw/2+55);x.textAlign='left'}
    x.restore();
    x.fillStyle='#12302A';x.font='600 32px '+B;
    var nl=wrap(x,p.name,cw-48,2);nl.forEach(function(l,k){x.fillText(l,cx+24,cy+cw+46+k*38)});
    x.fillStyle='#0F7A68';x.font='700 44px '+F;x.fillText(brl(p.price),cx+24,cy+cw+46+(nl.length-1)*38+54);
    var vs=[];if(p.colors.length)vs.push(p.colors.join(', '));if(p.sizes.length)vs.push(p.sizes.join(', '));
    if(vs.length){x.fillStyle='#5A716B';x.font='500 24px '+B;x.fillText(ellip(x,vs.join(' · '),cw-48),cx+24,cy+cw+info-18)}
  });
  return cv.toDataURL('image/jpeg',.9);
}

  selOne:function(el){T.sel.clear();T.sel.add(el.dataset.id);closeSheet();openSell()},
  sell:openSell,
  slPaid:function(el){SL.paid=el.dataset.v==='1';$('#sl-p1').classList.toggle('on',SL.paid);$('#sl-p0').classList.toggle('on',!SL.paid);$('#sl-par').hidden=SL.paid;if(!SL.paid&&!SL.inst.length)instInit();drawInst()},
  sellGo:sellGo,
  newCli:function(){clientForm()},
  openCli:function(el){T.client=el.dataset.id;T.ctab='buys';render()},
  backCli:function(){T.client=null;render()},
  editCli:function(){clientForm(T.client)},
  saveCli:function(el){
    var n=$('#cf-name').value.trim();if(!n){toast('Digite o nome do cliente');return}
    var id=el.dataset.id,ph=$('#cf-phone').value.trim();
    if(id){var c=client(id);c.name=n;c.phone=ph}else{var nc={id:uid(),name:n,phone:ph,comments:[],buys:[]};S.clients.push(nc)}
    save();closeSheet();render();toast('Cliente salvo');
  },
  delCli:function(el){twoTap(el,function(){S.clients=S.clients.filter(function(c){return c.id!==el.dataset.id});T.client=null;save();closeSheet();render();toast('Cliente removido')})},
  ctab:function(el){T.ctab=el.dataset.v;render()},
  togglePaid:function(el){var c=client(T.client),b=c.buys.find(function(x){return x.id===el.dataset.id});b.paid=!b.paid;save();render()},
  delBuy:function(el){twoTap(el,function(){var c=client(T.client);var gone=c.buys.find(function(x){return x.id===el.dataset.id});c.buys=c.buys.filter(function(x){return x.id!==el.dataset.id});if(gone&&gone.sid&&!c.buys.some(function(x){return x.sid===gone.sid}))c.parc=(c.parc||[]).filter(function(p){return p.sid!==gone.sid});save();render()})},
  newBuy:buyForm,
  buyGo:function(){
    var c=client(T.client),p=prod($('#bf-prod').value),qty=Math.max(1,parseInt($('#bf-qty').value,10)||1),col=$('#bf-color'),sz=$('#bf-size');
    var color=col?col.value:'',size=sz?sz.value:'';
    if(!$('#bf-paid').checked&&!$('#bf-due').value){toast('Escolha o vencimento da 1ª parcela');return}
    if($('#bf-stock').checked){
      var r=S.stock.find(function(x){return x.pid===p.id&&x.color===color&&x.size===size});
      if(!r||r.qty<qty){toast('Não há essa quantidade em estoque');return}
      r.qty-=qty;S.stock=S.stock.filter(function(x){return x.qty>0});
    }
    var price=parseNum($('#bf-price').value),paid=$('#bf-paid').checked,sid=paid?undefined:uid();
    c.buys.push({id:uid(),t:Date.now(),pid:p.id,name:p.name,color:color,size:size,qty:qty,price:price,paid:paid,sid:sid});
    if(sid){var n=+$('#bf-n').value,cents=Math.round(qty*price*100),bs=Math.floor(cents/n),rm=cents-bs*n,dp=$('#bf-due').value.split('-'),d0=new Date(+dp[0],+dp[1]-1,+dp[2]);c.parc=c.parc||[];for(var i=0;i<n;i++)c.parc.push({id:uid(),sid:sid,i:i+1,n:n,due:ymd(addMonths(d0,i)),val:(bs+(i<rm?1:0))/100,paid:false})}
    save();closeSheet();render();toast('Compra adicionada');
  },
  addCm:function(){var t=$('#cm-text').value.trim();if(!t){toast('Escreva o comentário');return}client(T.client).comments.push({id:uid(),t:Date.now(),text:t});save();render();toast('Comentário salvo')},
  delCm:function(el){twoTap(el,function(){var c=client(T.client);c.comments=c.comments.filter(function(m){return m.id!==el.dataset.id});save();render()})},
  seed:seed,
  yr:function(el){T.year+=+el.dataset.v;monthStrip()},
  mon:function(el){monthSheet(+el.dataset.m)},
  cobList:cobList,
  cobrar:function(el){cobrarSheet(el.dataset.id)},
  cobGo:function(el){
    var c=client(el.dataset.id),ph=$('#cob-phone').value.trim(),d=ph.replace(/\D/g,'');
    if(!d){toast('Digite o WhatsApp do cliente');return}
    if(d.length<=11)d='55'+d;
    c.phone=ph;save();
    window.open('https://wa.me/'+d+'?text='+encodeURIComponent($('#cob-text').value),'_blank');
  },
  togglePar:function(el){var c=client(T.client),p=(c.parc||[]).find(function(x){return x.id===el.dataset.id});if(p){p.paid=!p.paid;save();render()}},
  shareCat:function(){
    if(!S.products.some(function(p){return p.cat})){toast('Adicione produtos ao catálogo primeiro');return}
    toast('Gerando imagem…');
    buildCatalog().then(function(url){
      var o=sheet('Catálogo pronto','<img class="shareimg" id="cat-img" alt="Catálogo" src="'+url+'">'
        +(dl?'<button class="btn pri block" data-act="catSave">Salvar imagem</button>':'')
        +'<p class="muted" style="margin:0">'+(dl?'Depois de salvar, envie pelo WhatsApp. ':'')+'Você também pode segurar o dedo sobre a imagem e escolher “Salvar nas Fotos”.</p>');
      o.dataset.url=url;
    }).catch(function(){toast('Não foi possível gerar a imagem')});
  },
  catSave:function(){
    var url=$('#ov').dataset.url,b;
    try{b=dataToBlob(url)}catch(e){toast('Não foi possível salvar');return}
    dl.save({filename:'catalogo.jpg',data:b}).then(function(){toast('Imagem salva')}).catch(function(e){
      if(e&&e.code==='declined')return;
      toast('Segure o dedo sobre a imagem e escolha “Salvar nas Fotos”');
    });
  },
  bkSave:function(){
    if(!dl){A.bkCopy();return}
    dl.save({filename:'backup-catalogo-'+new Date().toISOString().slice(0,10)+'.json',data:backupJSON()}).then(function(){toast('Backup salvo')}).catch(function(e){
      if(e&&e.code==='declined')return;
      toast('Não deu para salvar como arquivo. Copie o texto.');A.bkCopy();
    });
  },
  bkCopy:function(){
    sheet('Texto do backup','<p class="muted" style="margin:0">Copie todo o texto e guarde em um lugar seguro, como o app Notas.</p><textarea class="inp" id="bk-text" readonly style="min-height:160px"></textarea><button class="btn pri block" data-act="bkDoCopy">Copiar texto</button>');
    $('#bk-text').value=backupJSON();
  },
  bkDoCopy:function(){
    var t=$('#bk-text');t.select();t.setSelectionRange(0,t.value.length);
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(function(){toast('Copiado')}).catch(function(){toast('Texto selecionado. Toque em Copiar no menu do iPhone.')});
  },
  bkImport:function(){
    sheet('Restaurar backup','<p class="muted" style="margin:0">Isso substitui tudo que está no app agora.</p>'
      +'<label class="btn block" style="text-align:center">Escolher arquivo de backup<input id="bk-file" data-on="bkFile" type="file" accept=".json,application/json,text/plain" hidden></label>'
      +'<div class="fld"><span>Ou cole o texto do backup</span><textarea class="inp" id="bk-paste" placeholder="Cole aqui"></textarea></div>'
      +'<button class="btn dng block" data-act="bkRestore">Restaurar</button>');
  },
  bkRestore:function(el){
    var v=$('#bk-paste').value.trim();if(!v){toast('Cole o texto do backup');return}
    twoTap(el,function(){restore(v)});
  }
};
function restore(text){
  try{var o=JSON.parse(text);if(!o||!Array.isArray(o.products))throw 0;S=normalize(o);save();closeSheet();T.client=null;render();toast('Backup restaurado')}
  catch(e){toast('Esse texto não é um backup válido')}
}

/* ---------- Eventos de campo ---------- */
var H={
  qProd:function(el){T.q.prod=el.value;listProd()},
  qStock:function(el){T.q.stock=el.value;listStock()},
  qCli:function(el){T.q.cli=el.value;listCli()},
  pfPhoto:function(el){var f=el.files&&el.files[0];if(!f)return;readPhoto(f).then(function(u){PF.photo=u;$('#pf-pv').innerHTML='<img alt="" src="'+u+'">'}).catch(function(){toast('Não foi possível ler a foto')})},
  saProd:saVars,
  bfProd:bfVars,
  bfPaid:function(el){$('#bf-par').hidden=el.checked},
  slCli:function(el){SL.cid=el.value;$('#sl-new').hidden=el.value!=='__new'},
  slName:function(el){SL.newName=el.value},
  slN:function(el){SL.n=+el.value;instInit();drawInst()},
  slEq:function(el){SL.eq=el.checked;if(SL.eq)instSplit(true);drawInst()},
  slDue:function(el){SL.inst[+el.dataset.i].due=el.value},
  slVal:function(el){SL.inst[+el.dataset.i].val=parseNum(el.value);slDiff()},
  slVar:function(el){var l=SL.lines[+el.dataset.i];l.rid=el.value;var r=srow(l.rid);l.qty=Math.min(l.qty,r.qty);drawLines()},
  slQty:function(el){var l=SL.lines[+el.dataset.i],r=srow(l.rid);l.qty=Math.max(1,Math.min(r.qty,parseInt(el.value,10)||1));slTotal()},
  slPrice:function(el){SL.lines[+el.dataset.i].price=parseNum(el.value);slTotal()},
  shop:function(el){S.shop=el.value;save()},
  bkFile:function(el){var f=el.files&&el.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){$('#bk-paste').value=String(fr.result);toast('Arquivo lido. Toque em Restaurar.')};fr.readAsText(f)}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el,e)});
['input','change'].forEach(function(ev){document.addEventListener(ev,function(e){var el=e.target.closest('[data-on]');if(el&&H[el.dataset.on])H[el.dataset.on](el,e)})});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.kind){e.preventDefault();chipAdd(e.target.dataset.kind)}
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[role=button]')){e.preventDefault();e.target.click()}
  else if(e.key==='Escape')closeSheet();
});

function start(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{render()}catch(e){showErr(e.message)}
  initDownloads();
  load().then(function(){try{render()}catch(e){showErr(e.message)}}).catch(function(){});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

try{if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}catch(e){}
</script>
