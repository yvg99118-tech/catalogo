.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px 8px;display:grid;justify-items:center;gap:6px;min-width:0}
.pal small{font-weight:600;color:var(--ink);font-size:12.5px}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small,.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:720px;margin:0 auto}
#hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}

.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;border-radius:12px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.gw{max-width:560px;margin:0 auto;display:grid;gap:14px;align-content:start}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.gbrand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.gh{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.gnote{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.plan.feat{border-color:var(--accent)}
.plan h3{margin:0;font-family:var(--f-display);font-size:23px}
.plan .pr{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .pr small{font-family:var(--f-body);font-size:13.5px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}

.plan li::before{content:"✓";color:var(--accent);font-weight:700}

.tag{justify-self:start;background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.accbar{display:flex;gap:10px;align-items:center;justify-content:space-between}

.dt small{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.dt strong{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dt em{font-style:normal;font-size:12px;color:var(--muted)}
.dt.hot{border-color:var(--accent)}

.dt.late small,.dt.late strong,.dt.late em{color:var(--warn)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--ink);min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn.dng{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin:2px 0 12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);min-width:0}
.card .ph{aspect-ratio:1/1;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--muted);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .cb b{font-weight:600;overflow-wrap:anywhere}

.cbtns{display:grid;gap:6px;margin:6px 10px 10px}
.cbtns .btn{margin:0}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;display:grid;gap:10px;justify-items:center}

.sum div:nth-child(2){background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sum small{display:block;color:inherit;opacity:.8;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sum strong{font-family:var(--f-display);font-size:25px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.list{display:grid;gap:8px}

.th img{width:100%;height:100%;object-fit:cover}

.right{text-align:right;display:grid;gap:2px}
.qty{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}

.day{margin:14px 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:6px}

.cm .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--danger);font-weight:600;padding:4px 0;font-size:13px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}

function genRec(){
  if(!Array.isArray(S.rec))return;
  var lim=ym(new Date(Date.now()+5*864e5)),ch=false;
  S.rec.forEach(function(r){
    r.done=r.done||[];
    for(var m=r.from;m<=lim;m=addM(m,1)){
      if(r.done.indexOf(m)>-1)continue;
      var p=m.split('-'),last=new Date(+p[0],+p[1],0).getDate();
      r.done.push(m);ch=true;
      S.tx.push({id:uid(),rid:r.id,type:r.type,desc:r.desc,val:r.val,cat:r.cat,date:m+'-'+String(Math.min(r.day,last)).padStart(2,'0'),paid:false});
    }
  });
  if(ch)save();
}

function saveRec(id){
  var val=parseNum($('#f-val').value),day=+$('#f-day').value;

  else{S.rec.push({id:uid(),type:F.type,desc:desc,val:val,cat:cid,day:day,from:ym(new Date()),done:[]});logA('Criou conta fixa',desc,val)}

  var cur=t?t.cat:(S.cats.find(function(c){return c.t===F.type})||{}).id;
  sheet(t?'Editar lançamento':'Novo lançamento',
    '<div class="seg"><button id="ft-d" class="'+(F.type==='d'?'on':'')+'" data-act="fType" data-v="d">Despesa</button><button id="ft-r" class="'+(F.type==='r'?'on':'')+'" data-act="fType" data-v="r">Receita</button></div>'
    +'<label class="fld"><span>Valor (R$)</span><input id="f-val" type="text" inputmode="decimal" placeholder="0,00" value="'+(t?fmtNum(t.val):'')+'"></label>'
    +'<label class="fld"><span>Descrição</span><input id="f-desc" type="text" placeholder="Ex.: Mercado, Aluguel" value="'+esc(t?t.desc:'')+'" autocomplete="off"></label>'
    +'<div class="two-f"><label class="fld"><span>Categoria</span><select id="f-cat">'+catOpts(F.type,cur)+'</select></label><label class="fld"><span>Data</span><input id="f-date" type="date" value="'+(t?t.date:ymd(new Date()))+'"></label></div>'
    +'<label class="chk"><input type="checkbox" id="f-paid" '+((t?t.paid:S.defPaid)?'checked':'')+'> Já foi pago ou recebido</label>'
    +(t?'':'<label class="chk" style="justify-content:space-between"><span>Repetir</span><input type="checkbox" id="f-rep" role="switch" data-act="repT"></label><div id="rep-box" hidden style="display:grid;gap:10px"><label class="chk"><input type="radio" name="rk" id="rk-f" checked data-act="rkT"> Fixo (todo mês, sem data final)</label><label class="chk"><input type="radio" name="rk" id="rk-p" data-act="rkT"> Parcelado</label><label class="fld" id="np-box" hidden><span>Número de parcelas</span><input id="f-n" type="number" min="2" max="60" value="12" inputmode="numeric"></label></div>')
    +'<button class="btn pri block" data-act="save" data-id="'+(id||'')+'">Salvar</button>'
    +(t?'<button class="btn dng block" data-act="del" data-id="'+id+'">Remover lançamento</button>':''));
  if(!t)setTimeout(function(){var e=$('#f-val');if(e)e.focus()},60);
}
function saveTx(id){
  var val=parseNum($('#f-val').value);if(!(val>0)){toast('Informe um valor maior que zero');return}
  var date=$('#f-date').value;if(!date){toast('Escolha a data');return}
  var cid=$('#f-cat').value,c=cat(cid),desc=$('#f-desc').value.trim()||(c?c.name:'Lançamento'),paid=$('#f-paid').checked,rep=!!($('#f-rep')&&$('#f-rep').checked);
  if(id){var t=S.tx.find(function(x){return x.id===id});if(t){t.type=F.type;t.desc=desc;t.val=val;t.cat=cid;t.date=date;t.paid=paid;logA('Editou',desc,val)}}
  else if(rep&&$('#rk-f').checked){if(!Array.isArray(S.rec))S.rec=[];var nr={id:uid(),type:F.type,desc:desc,val:val,cat:cid,day:+date.slice(8),from:date.slice(0,7),done:[]};S.rec.push(nr);logA('Criou conta fixa',desc,val);genRec();S.tx.forEach(function(x){if(x.rid===nr.id&&x.date.slice(0,7)===nr.from)x.paid=paid})}else{var n=rep&&$('#f-n')?(+$('#f-n').value||1):1;for(var i=0;i<n;i++)S.tx.push({id:uid(),type:F.type,desc:n>1?desc+' ('+(i+1)+'/'+n+')':desc,val:val,cat:cid,date:addDate(date,i),paid:i===0&&paid});logA('Criou',desc+(n>1?' · '+n+' meses':''),val)}
  T.m=date.slice(0,7);save();closeSheet();render();toast('Lançamento salvo');
}
function catForm(id){
  var c=id?cat(id):null;C.type=c?c.t:'d';
  sheet(c?'Editar categoria':'Nova categoria',
    (c?'':'<div class="seg"><button id="ct-d" class="on" data-act="cType" data-v="d">Despesa</button><button id="ct-r" data-act="cType" data-v="r">Receita</button></div>')
    +'<div class="two-f" style="grid-template-columns:90px 1fr"><label class="fld"><span>Ícone</span><input id="c-emoji" type="text" maxlength="4" value="'+esc(c?c.emoji:'📦')+'"></label><label class="fld"><span>Nome</span><input id="c-name" type="text" value="'+esc(c?c.name:'')+'" autocomplete="off"></label></div>'
    +'<label class="fld" id="c-limbox" '+(C.type==='d'?'':'hidden')+'><span>Limite mensal (R$, opcional)</span><input id="c-lim" type="text" inputmode="decimal" placeholder="0,00" value="'+(c&&c.limit?fmtNum(c.limit):'')+'"></label>'
    +'<button class="btn pri block" data-act="saveCat" data-id="'+(id||'')+'">Salvar categoria</button>'
    +(c?'<button class="btn dng block" data-act="delCat" data-id="'+id+'">Remover categoria</button>':''));
}
function saveCat(id){
  var name=$('#c-name').value.trim();if(!name){toast('Dê um nome à categoria');return}
  var emoji=$('#c-emoji').value.trim()||'📦',lim=C.type==='d'?parseNum($('#c-lim').value):0;
  logA(id?'Editou categoria':'Criou categoria',name);if(id){var c=cat(id);c.name=name;c.emoji=emoji;c.limit=lim}else S.cats.push({id:uid(),name:name,emoji:emoji,t:C.type,limit:lim});
  save();closeSheet();render();
}

/* ---------- Eventos ---------- */
var A={
  tab:function(el){T.tab=el.dataset.tab;render()},
  mPrev:function(){T.m=addM(T.m,-1);render()},mNext:function(){T.m=addM(T.m,1);render()},
  flt:function(el){T.f=el.dataset.v;vTx()},
  new:function(){txForm()},pay:function(el){var t=S.tx.find(function(x){return x.id===el.dataset.id});if(t){t.paid=true;logA('Pagou',t.desc,t.val);save();var s=$('#main').scrollTop;render();$('#main').scrollTop=s;toast('Marcada como paga')}},edit:function(el){txForm(el.dataset.id)},
  fType:function(el){F.type=el.dataset.v;$('#ft-d').classList.toggle('on',F.type==='d');$('#ft-r').classList.toggle('on',F.type==='r');$('#f-cat').innerHTML=catOpts(F.type)},
  save:function(el){saveTx(el.dataset.id)},
  del:function(el){twoTap(el,function(){var dx=S.tx.find(function(t){return t.id===el.dataset.id});if(dx)logA('Removeu',dx.desc,dx.val);S.tx=S.tx.filter(function(t){return t.id!==el.dataset.id});save();closeSheet();render();toast('Removido')})},
  newCat:function(){catForm()},editCat:function(el){catForm(el.dataset.id)},
  cType:function(el){C.type=el.dataset.v;$('#ct-d').classList.toggle('on',C.type==='d');$('#ct-r').classList.toggle('on',C.type==='r');$('#c-limbox').hidden=C.type!=='d'},
  saveCat:function(el){saveCat(el.dataset.id)},
  delCat:function(el){
    if(S.tx.some(function(t){return t.cat===el.dataset.id})){toast('Esta categoria tem lançamentos e não pode ser removida');return}
    twoTap(el,function(){var dc=cat(el.dataset.id);if(dc)logA('Removeu categoria',dc.name);S.cats=S.cats.filter(function(c){return c.id!==el.dataset.id});save();closeSheet();render()})},
  pal:function(el){S.theme=el.dataset.id;applyTheme();save();vSet()},
  bkCopy:function(){
    var j=JSON.stringify(S);
    (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(function(){toast('Backup copiado')}).catch(function(){
      sheet('Texto do backup','<p class="muted" style="margin:0">Copie todo o texto e guarde no app Notas.</p><textarea class="inp" id="bk-t" readonly style="min-height:160px">'+esc(j)+'</textarea>');var t=$('#bk-t');if(t){t.focus();t.select()}})},
  bkOpen:function(){sheet('Restaurar backup','<p class="muted" style="margin:0">Cole o texto do backup. Isso substitui os dados atuais.</p><textarea class="inp" id="bk-p" placeholder="Cole aqui"></textarea><button class="btn pri block" data-act="bkGo">Restaurar</button>')},
  bkGo:function(){try{var o=JSON.parse($('#bk-p').value);if(!valid(o))throw 0;S=o;save();applyTheme();closeSheet();render();toast('Backup restaurado')}catch(e){toast('Texto de backup inválido')}},
  wipe:function(el){twoTap(el,function(){S=DEF();save();applyTheme();render();toast('Dados apagados')})},
  hSub:function(el){T.h=el.dataset.v;vHist()},
  unpay:function(el){var t=S.tx.find(function(x){return x.id===el.dataset.id});if(t){t.paid=false;logA('Desfez pagamento',t.desc,t.val);save();var s=$('#main').scrollTop;render();$('#main').scrollTop=s;toast('Voltou para pendente')}},
  newRec:function(){recForm()},editRec:function(el){recForm(el.dataset.id)},saveRec:function(el){saveRec(el.dataset.id)},
  delRec:function(el){twoTap(el,function(){var r=S.rec.find(function(x){return x.id===el.dataset.id});if(r)logA('Removeu conta fixa',r.desc,r.val);S.rec=S.rec.filter(function(x){return x.id!==el.dataset.id});save();closeSheet();render()})},
  csv:function(){
    var rows=[['Data','Tipo','Descrição','Categoria','Valor','Situação']].concat(S.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(t){var c=cat(t.cat);return [t.date.split('-').reverse().join('/'),t.type==='d'?'Despesa':'Receita',t.desc,c?c.name:'',fmtNum(t.val),t.paid?'Pago':'Pendente']}));
    var s='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download='despesas.csv';document.body.appendChild(a);a.click();a.remove();toast('Planilha gerada')}catch(e){toast('Não foi possível gerar o arquivo')}
  },
  drawer:openDrawer,goHome:function(){T.tab='home';render()},
  dgo:function(el){closeSheet();if(el.dataset.h)T.h=el.dataset.h;if(el.dataset.tab){T.tab=el.dataset.tab;render()}else if(A[el.dataset.to])A[el.dataset.to](el)},
  repT:function(){$('#rep-box').hidden=!$('#f-rep').checked},rkT:function(){$('#np-box').hidden=!$('#rk-p').checked},
  histClear:function(el){twoTap(el,function(){S.log=[];save();render();toast('Histórico limpo')})},
  closeSheet:closeSheet,ovClose:closeSheet
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='ovClose'&&e.target!==el)return;
  var f=A[el.dataset.act];if(f)f(el);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape')closeSheet();
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){T.q=e.target.value;txList()}
  if(e.target.id==='shop'){S.shop=e.target.value;save()}
  if(e.target.id==='defpaid'){S.defPaid=e.target.checked;save()}
});
load();genRec();applyTheme();render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body></html>
